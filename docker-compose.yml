version: '3.8'

services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=docker
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STATIC_LLM_PROVIDER=${STATIC_LLM_PROVIDER:-}
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY:-}
      - FIREWORKS_MODEL=${FIREWORKS_MODEL:-}
      # vLLM (UKY Qwen) — required when LLM_PROVIDER=vllm
      - VLLM_BASE_URL=${VLLM_BASE_URL:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-}
      # UKY document RAG endpoints
      - UKY_RAG_ENABLED=${UKY_RAG_ENABLED:-false}
      - UKY_RAG_GENERAL_URL=${UKY_RAG_GENERAL_URL:-}
      - UKY_RAG_XDMOD_URL=${UKY_RAG_XDMOD_URL:-}
      - UKY_RAG_TIMEOUT=${UKY_RAG_TIMEOUT:-60.0}
      # UKY chat-mcp endpoint (chunk retrieval for agent-side synthesis)
      - UKY_CHATMCP_URL=${UKY_CHATMCP_URL:-}
      - UKY_CHATMCP_API_KEY=${UKY_CHATMCP_API_KEY:-}
      # pgvector QA service + MCP host (for tool calls)
      - QA_SERVICE_URL=${QA_SERVICE_URL:-}
      - MCP_SERVER_HOST=${MCP_SERVER_HOST:-host.docker.internal}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/langgraph
      # Catalog is live-aggregated from each MCP server's /tools at startup and
      # cached in memory; no static file or generator service is needed.
      # UKY document RAG
      - ACCESS_AI_API_KEY=${ACCESS_AI_API_KEY:-}
      # Drupal endpoint for resource group section cache
      - DRUPAL_RESOURCE_GROUPS_URL=${DRUPAL_RESOURCE_GROUPS_URL:-https://support.access-ci.org/api/1.0/resource-groups}
      # MCP API key for servers requiring authentication (announcements, events, jsm)
      - MCP_API_KEY=${MCP_API_KEY:-}
      # Capability gating (comma-separated capability ids). See docker-compose.prod.yml:
      # extract_xdmod_data is gated off by default until the per-user XDMoD token flow exists.
      - DISABLED_CAPABILITIES=${DISABLED_CAPABILITIES:-extract_xdmod_data}
      - ENABLED_CAPABILITIES=${ENABLED_CAPABILITIES:-}
      # JWT Authentication (ES256 + JWKS)
      - TRUSTED_JWKS_URLS=${TRUSTED_JWKS_URLS:-}
      - ALLOW_BODY_ACTING_USER=${ALLOW_BODY_ACTING_USER:-true}
      # Turnstile bot protection (Cloudflare)
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - TURNSTILE_MODE=${TURNSTILE_MODE:-deferred}
      - TURNSTILE_FREE_QUERIES=${TURNSTILE_FREE_QUERIES:-3}
      - TURNSTILE_SESSION_TTL=${TURNSTILE_SESSION_TTL:-3600}
      # OpenTelemetry - Honeycomb
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-https://api.honeycomb.io}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - HONEYCOMB_DATASET=${HONEYCOMB_DATASET:-access-ci}
    extra_hosts:
      # Resolve DDEV site from within container for JWKS endpoint access
      - "accessmatch.ddev.site:host-gateway"
    depends_on:
      - postgres
    networks:
      - agent-network
      - mcp-network

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: langgraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only — never expose Postgres to the public internet
      - "127.0.0.1:5432:5432"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  agent-network:
    driver: bridge
  mcp-network:
    external: true  # Assumes MCP servers are on this network

volumes:
  postgres_data:
  redis_data:
