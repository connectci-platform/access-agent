version: '3.8'

services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Override DATABASE_URL to use Docker service name
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/langgraph
    depends_on:
      - postgres
    networks:
      - agent-network

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langgraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  agent-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
