version: '3.8'

services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=docker
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STATIC_LLM_PROVIDER=${STATIC_LLM_PROVIDER:-}
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY:-}
      - FIREWORKS_MODEL=${FIREWORKS_MODEL:-}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/langgraph
      - MCP_CATALOG_URL=http://n8n:5678/webhook/generate-mcp-catalog
      - QA_SERVICE_URL=${QA_SERVICE_URL:-http://localhost:8001}
      # JWT Authentication
      - JWT_SECRET=${JWT_SECRET:-}
      - ALLOW_BODY_ACTING_USER=${ALLOW_BODY_ACTING_USER:-true}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      # OpenTelemetry - Honeycomb
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-https://api.honeycomb.io}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - HONEYCOMB_DATASET=${HONEYCOMB_DATASET:-access-ci}
    depends_on:
      - postgres
      - vault
    networks:
      - agent-network
      - mcp-network

  vault:
    image: hashicorp/vault:1.15
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
    networks:
      - agent-network

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langgraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  agent-network:
    driver: bridge
  mcp-network:
    external: true  # Assumes MCP servers are on this network

volumes:
  postgres_data:
  redis_data:
  vault_data:
