name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/access-agent

jobs:
  # CI is a separate workflow on the same push, so `needs:` cannot reach it and
  # the two would otherwise race. Waiting here keeps `push` as the trigger; a
  # workflow_run trigger would repoint github.sha/ref_name, which stamp the image.
  await-ci:
    runs-on: ubuntu-latest
    # A manual dispatch may have no CI run for that ref; the wait would hang.
    if: github.event_name != 'workflow_dispatch'
    # wait-on-check-action >= 1.9 reads check runs, which the default token
    # cannot see without this.
    permissions:
      checks: read
    steps:
      - name: Wait for CI to pass on this commit
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.sha }}
          check-name: lint-and-test
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  build-and-push:
    needs: await-ci
    # Lets the skipped await-ci through on dispatch; a real failure still blocks.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so `git describe` can see tags for AGENT_VERSION.
          fetch-depth: 0

      - name: Compute version stamp
        id: version
        # No tags yet → short sha. The day a tag exists (e.g. v1.0.0), builds
        # automatically report v1.0.0-<n>-g<sha> — tags are opt-in semver.
        run: echo "describe=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AGENT_VERSION=${{ steps.version.outputs.describe }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd ~/access-agent

            # Configure git to use PAT for authentication (private repo)
            git config credential.helper store
            echo "https://${{ github.actor }}:${{ secrets.GHCR_PAT }}@github.com" > ~/.git-credentials

            # Ensure this is a git checkout of the repo before pulling. On a
            # freshly provisioned host ~/access-agent may hold only the compose
            # file + Caddyfile (private image deploys don't need the source), so
            # initialise the clone in place on first deploy.
            if [ ! -d .git ]; then
              echo "No git checkout found — initialising in place..."
              git init -q
              git remote add origin https://github.com/${{ github.repository }}.git
            fi

            # Pull latest code
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Wait for registry propagation
            echo "Waiting for registry propagation..."
            sleep 10

            # Pull latest images with retry
            echo "Pulling latest images..."
            for i in 1 2 3; do
              docker compose -f docker-compose.prod.yml pull && break
              echo "Pull attempt $i failed, retrying in 10s..."
              sleep 10
            done

            # Restart services
            echo "Restarting services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old images
            echo "Cleaning up old images..."
            docker image prune -f

            # Install weekly report cron job (Monday 9am ET / 14:00 UTC)
            chmod +x "$HOME/access-agent/scripts/send-weekly-report.sh"
            CRON_CMD="0 14 * * 1 $HOME/access-agent/scripts/send-weekly-report.sh"
            (crontab -l 2>/dev/null | grep -v send-weekly-report; echo "$CRON_CMD") | crontab -

            # Show running containers
            echo "Running containers:"
            docker compose -f docker-compose.prod.yml ps
            echo ""
            echo "Image versions:"
            docker compose -f docker-compose.prod.yml images

      - name: Smoke test agent
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            AGENT_CONTAINER="access-agent-access-agent-1"

            # Helper: run HTTP requests inside the agent container (port 8000
            # is not published to the host — Caddy handles external traffic).
            # The && return 0 || return 1 pattern prevents set -e from killing
            # the script when docker exec fails (e.g., container not ready yet).
            agent_request() {
              docker exec "$AGENT_CONTAINER" python -c "$1" && return 0 || return 1
            }

            echo "Waiting for agent to be ready..."
            READY=false
            for i in $(seq 1 24); do
              if agent_request "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" > /dev/null 2>&1; then
                READY=true
                break
              fi
              echo "  attempt $i/24..."
              sleep 5
            done

            if [ "$READY" != "true" ]; then
              echo "FAIL: Agent not ready after 2 minutes"
              exit 1
            fi

            # 1. Health check — verify tool catalog is complete
            echo "Checking agent health..."
            HEALTH=$(agent_request "import urllib.request,json; r=urllib.request.urlopen('http://localhost:8000/api/v1/health'); print(r.read().decode())")

            if [ -z "$HEALTH" ]; then
              echo "FAIL: Agent health endpoint not responding"
              exit 1
            fi

            STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            TOOLS=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tools',{}).get('total',0))")
            SERVERS=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tools',{}).get('servers_available',0))")
            TOTAL_SERVERS=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tools',{}).get('servers_total',0))")

            echo "  Status: $STATUS"
            echo "  Tools: $TOOLS"
            echo "  Servers: $SERVERS/$TOTAL_SERVERS"

            if [ "$STATUS" != "healthy" ]; then
              echo "FAIL: Agent status is $STATUS"
              echo "$HEALTH"
              exit 1
            fi

            # 2. Query + usage log check
            echo "Sending smoke test query..."
            SMOKE_ID="smoke-$(date +%s)"
            RESPONSE=$(agent_request "import urllib.request,json; req=urllib.request.Request('http://localhost:8000/api/v1/query',data=json.dumps({'query':'smoke test','session_id':'${SMOKE_ID}'}).encode(),headers={'Content-Type':'application/json'},method='POST'); r=urllib.request.urlopen(req,timeout=120); print(r.read().decode())")

            if [ -z "$RESPONSE" ]; then
              echo "FAIL: Smoke test query failed"
              exit 1
            fi

            # /api/v1/query streams Server-Sent Events (event: status / event: done),
            # not a single JSON object. Pull `success` from the `data:` payload of the
            # terminal `done` event. Kept on one line so the embedded Python stays valid YAML.
            SUCCESS=$(echo "$RESPONSE" | python3 -c "import sys,json; objs=[json.loads(l[5:].strip()) for l in sys.stdin if l.strip().startswith('data:') and l[5:].strip()]; vals=[o['success'] for o in objs if 'success' in o]; print(vals[-1] if vals else None)")
            if [ "$SUCCESS" != "True" ]; then
              echo "FAIL: Query returned success=false"
              echo "$RESPONSE"
              exit 1
            fi

            # Verify usage logging
            sleep 3
            CONTAINER=$(docker ps -q -f name=postgres -f ancestor=pgvector/pgvector:pg16)
            COUNT=$(docker exec "$CONTAINER" psql -U postgres -d langgraph -tAc \
              "SELECT COUNT(*) FROM usage_logs WHERE session_id='${SMOKE_ID}';")

            if [ "$COUNT" -lt 1 ]; then
              echo "FAIL: Usage logging not working (0 rows for smoke test)"
              exit 1
            fi

            echo "OK: Agent healthy, query succeeded, usage logged"
