name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/access-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: github
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd ~/access-agent

            # Configure git to use PAT for authentication
            git config credential.helper store
            echo "https://${{ github.actor }}:${{ secrets.GHCR_PAT }}@github.com" > ~/.git-credentials

            # Pull latest code
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Login to GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Wait for registry propagation
            echo "Waiting for registry propagation..."
            sleep 10

            # Pull latest images with retry
            echo "Pulling latest images..."
            for i in 1 2 3; do
              docker compose -f docker-compose.prod.yml pull && break
              echo "Pull attempt $i failed, retrying in 10s..."
              sleep 10
            done

            # Restart services
            echo "Restarting services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old images
            echo "Cleaning up old images..."
            docker image prune -f

            # Install weekly report cron job (Monday 9am ET / 14:00 UTC)
            chmod +x ~/access-agent/scripts/send-weekly-report.sh
            CRON_CMD="0 14 * * 1 /home/github/access-agent/scripts/send-weekly-report.sh"
            (crontab -l 2>/dev/null | grep -v send-weekly-report; echo "$CRON_CMD") | crontab -

            # Show running containers
            echo "Running containers:"
            docker compose -f docker-compose.prod.yml ps
            echo ""
            echo "Image versions:"
            docker compose -f docker-compose.prod.yml images

      - name: Smoke test agent
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: github
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          script: |
            echo "Waiting for agent to be ready..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
                break
              fi
              echo "  attempt $i/12..."
              sleep 5
            done

            # 1. Health check — verify tool catalog is complete
            echo "Checking agent health..."
            HEALTH=$(curl -sf http://localhost:8000/api/v1/health)
            if [ $? -ne 0 ]; then
              echo "FAIL: Agent health endpoint not responding"
              exit 1
            fi

            STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            TOOLS=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tools',{}).get('total',0))")
            SERVERS=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tools',{}).get('servers_available',0))")
            TOTAL_SERVERS=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tools',{}).get('servers_total',0))")

            echo "  Status: $STATUS"
            echo "  Tools: $TOOLS"
            echo "  Servers: $SERVERS/$TOTAL_SERVERS"

            if [ "$STATUS" != "healthy" ]; then
              echo "FAIL: Agent status is $STATUS"
              echo "$HEALTH"
              exit 1
            fi

            # 2. Query + usage log check
            echo "Sending smoke test query..."
            SMOKE_ID="smoke-$(date +%s)"
            RESPONSE=$(curl -sf -X POST http://localhost:8000/api/v1/query \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"smoke test\", \"session_id\": \"${SMOKE_ID}\"}")

            if [ $? -ne 0 ]; then
              echo "FAIL: Smoke test query failed"
              exit 1
            fi

            SUCCESS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['success'])")
            if [ "$SUCCESS" != "True" ]; then
              echo "FAIL: Query returned success=false"
              exit 1
            fi

            # Verify usage logging
            sleep 3
            CONTAINER=$(docker ps -q -f name=postgres -f ancestor=pgvector/pgvector:pg16)
            COUNT=$(docker exec "$CONTAINER" psql -U postgres -d langgraph -tAc \
              "SELECT COUNT(*) FROM usage_logs WHERE session_id='${SMOKE_ID}';")

            if [ "$COUNT" -lt 1 ]; then
              echo "FAIL: Usage logging not working (0 rows for smoke test)"
              exit 1
            fi

            echo "OK: Agent healthy, query succeeded, usage logged"
