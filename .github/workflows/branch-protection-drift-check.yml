name: Branch Protection Drift Check

on:
  schedule:
    - cron: '0 13 * * 1'  # Weekly Monday 13:00 UTC (09:00 ET)
  workflow_dispatch:

permissions:
  contents: read
  administration: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip if snapshot not yet captured
        id: check-snapshot
        run: |
          if [ ! -f docs/security/branch-protection-snapshot.json ]; then
            echo "Snapshot file does not exist yet — branch protection is pending activation."
            echo "Run 'gh api repos/${{ github.repository }}/branches/main/protection > docs/security/branch-protection-snapshot.json' after the admin configures protection in GitHub UI."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Fetch current protection settings
        if: steps.check-snapshot.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/branches/main/protection > current.json

      - name: Diff against committed snapshot
        if: steps.check-snapshot.outputs.skip != 'true'
        run: |
          # Normalize by stripping volatile url fields before comparing
          jq 'del(.url, ..|.url?)' docs/security/branch-protection-snapshot.json > snapshot-normalized.json
          jq 'del(.url, ..|.url?)' current.json > current-normalized.json

          if ! diff -u snapshot-normalized.json current-normalized.json; then
            echo "::error::Branch protection settings have drifted from the committed snapshot."
            echo "::error::Review the diff above. If the change is intentional, re-snapshot and commit:"
            echo "::error::  gh api repos/${GITHUB_REPOSITORY}/branches/main/protection > docs/security/branch-protection-snapshot.json"
            exit 1
          fi

          echo "No drift."

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Branch protection drift detected — ${date}`,
              body: `The weekly drift check failed. See: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nIf intentional, re-snapshot and commit:\n\`\`\`\ngh api repos/${context.repo.owner}/${context.repo.repo}/branches/main/protection > docs/security/branch-protection-snapshot.json\n\`\`\``,
              labels: ['branch-protection', 'bug']
            });
