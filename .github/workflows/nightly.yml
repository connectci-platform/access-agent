name: Nightly Live-Dep Tests

on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC daily (05:00 ET)
  workflow_dispatch:     # Manual trigger for debugging

jobs:
  e2e:
    # Self-hosted on the mcp box: Linode's edge mitigation drops hosted-runner
    # connections to the MCP ports (verified by packet capture 2026-08-10).
    runs-on: [self-hosted, nightly-e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run e2e tests
        run: uv run pytest tests/ -m e2e -v
        env:
          # Production parity: the nightly exercises the same provider, endpoint,
          # and model the deployed loop runs. No OpenAI key on purpose — a code
          # path that silently falls back to OpenAI should fail loudly here.
          LLM_PROVIDER: vllm
          VLLM_BASE_URL: https://jump-external.ccs.uky.edu/v1
          VLLM_MODEL_NAME: ccs/Qwen/Qwen3.6-35B-A3B-FP8
          VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
          ACCESS_AI_API_KEY: ${{ secrets.ACCESS_AI_API_KEY }}
          # e2e tests live-aggregate the catalog from the prod MCP servers
          # (CatalogAggregator), so point them at the prod host.
          MCP_SERVER_HOST: 45.79.215.140
          DATABASE_URL: ""

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly e2e failure — ${date}`,
              body: `The nightly live-dep test run failed. See the workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['nightly-failure', 'bug']
            });
