name: Nightly Live-Dep Tests

on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC daily (05:00 ET)
  workflow_dispatch:     # Manual trigger for debugging

env:
  # Production parity: the nightly exercises the same provider, endpoint,
  # and model the deployed loop runs. No OpenAI key on purpose — a code
  # path that silently falls back to OpenAI should fail loudly here.
  LLM_PROVIDER: vllm
  VLLM_BASE_URL: https://jump-external.ccs.uky.edu/v1
  VLLM_MODEL_NAME: ccs/Qwen/Qwen3.6-35B-A3B-FP8
  # e2e tests + the red-team gate live-aggregate the catalog from the prod MCP
  # servers (CatalogAggregator), so point them at the prod host. Sourced from a
  # secret so the host moves with the deployment without a code change; the
  # fallback is burrow's current IP (mcp.access-ci.org -> 128.163.202.94 after
  # the DNS cutover), NOT the retired droplet.
  MCP_SERVER_HOST: ${{ secrets.PRODUCTION_MCP_HOST || '128.163.202.94' }}
  DATABASE_URL: ""

jobs:
  e2e:
    # Self-hosted runner on burrow (UKy's perimeter blocks external access to the
    # MCP ports, so a GitHub-hosted runner can't reach them). The runner was
    # migrated from the retired Linode droplet to burrow on 2026-08-14; the
    # droplet's runner is deregistered/label-removed and burrow serves nightly-e2e.
    runs-on: [self-hosted, nightly-e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run e2e tests
        id: e2e
        if: always()
        run: uv run pytest tests/ -m e2e -v
        env:
          VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
          ACCESS_AI_API_KEY: ${{ secrets.ACCESS_AI_API_KEY }}

      - name: Open issue on failure
        if: always() && steps.e2e.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly e2e failure — ${date}`,
              body: `The nightly live-dep test run failed. See the workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['nightly-failure', 'bug']
            });

      - name: Run synthetic tool probe
        id: probe
        if: always()
        run: uv run python -m src.probe
        env:
          # ENVIRONMENT=production is CRITICAL here: without it, config.mcp_server_urls
          # falls back to docker-internal service names the runner can't reach. The
          # probe needs no LLM, but ENVIRONMENT=production also trips the data-residency
          # guard in src/config.py (Settings construction), which requires
          # EVAL_JUDGE_BASE_URL to be set even though this probe never calls a judge.
          ENVIRONMENT: production
          EVAL_JUDGE_BASE_URL: ${{ secrets.EVAL_JUDGE_BASE_URL }}

      - name: Open issue on probe failure
        if: always() && steps.probe.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Tool health probe failure — ${date}`,
              body: `The nightly synthetic per-tool probe found at least one MCP tool returning a backend error. See the workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['tool-health', 'bug']
            });

  redteam-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, nightly-e2e]
    permissions:
      contents: read
    concurrency:
      group: nightly-redteam
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { version: "latest" }
      - run: uv python install 3.13
      - run: uv sync --extra dev --locked

      - name: Read suite pin from baseline
        id: pin
        run: |
          SV=$(uv run python -c "import json;print(json.load(open('tests/redteam/suite-v1/baseline.json'))['suite_version'])")
          echo "suite_version=$SV" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned suite
        env:
          GH_TOKEN: ${{ secrets.REDTEAM_SUITE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/redteam"
          gh release download "suite-${{ steps.pin.outputs.suite_version }}" \
            --repo necyberteam/access-redteam \
            --pattern prompts.json \
            --dir "$RUNNER_TEMP/redteam"

      - name: Content pre-check (id-set == baseline manifest)
        run: |
          uv run python -c "
          import json, sys
          base=json.load(open('tests/redteam/suite-v1/baseline.json'))
          got={p['id'] for p in json.load(open('$RUNNER_TEMP/redteam/prompts.json'))['prompts']}
          exp=set(base['expected_prompt_ids'])
          assert base['suite_version']=='${{ steps.pin.outputs.suite_version }}', 'version drift'
          assert got==exp, f'id-set mismatch missing={sorted(exp-got)} extra={sorted(got-exp)}'
          "

      - name: Run gate
        id: gate
        env:
          READ_ONLY: "true"
          ENVIRONMENT: production
          LLM_PROVIDER: ${{ env.LLM_PROVIDER }}
          VLLM_BASE_URL: ${{ env.VLLM_BASE_URL }}
          VLLM_MODEL_NAME: ${{ env.VLLM_MODEL_NAME }}
          VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
          ACCESS_AI_API_KEY: ${{ secrets.ACCESS_AI_API_KEY }}
          MCP_SERVER_HOST: ${{ env.MCP_SERVER_HOST }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          EVAL_JUDGE_BASE_URL: ${{ secrets.EVAL_JUDGE_BASE_URL }}
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
          REDTEAM_PROMPTS_PATH: ${{ runner.temp }}/redteam/prompts.json
          # Samples replayed per attack prompt. 5 repetitions is enough to surface a
          # non-deterministic regression without multiplying the ~147-prompt run's
          # cost against the on-prem judge.
          REDTEAM_N: "5"
          # Persistent, host-local, per-run: $RUNNER_TEMP is wiped after the job,
          # so a flagged regression's transcripts must land somewhere durable to
          # be investigable. Host-local + gofer-only keeps the harmful response
          # text on-prem (never in the public issue). Pruned to the last 14 runs
          # below. (The issue-body/status stay in $RUNNER_TEMP — transient, used
          # only within the run.)
          REDTEAM_ARTIFACT_DIR: /home/gofer/redteam-artifacts/${{ github.run_id }}
          REDTEAM_ISSUE_BODY: ${{ runner.temp }}/redteam/body-${{ github.run_id }}.md
          REDTEAM_STATUS_PATH: ${{ runner.temp }}/redteam/status-${{ github.run_id }}.json
        run: |
          : > "$REDTEAM_ISSUE_BODY"; : > "$REDTEAM_STATUS_PATH"
          # gofer-only perms on the persistent transcript dir (harmful response
          # text stays host-local; not PII, but keep it off other users' eyes).
          mkdir -p "$REDTEAM_ARTIFACT_DIR" && chmod 700 "$REDTEAM_ARTIFACT_DIR" /home/gofer/redteam-artifacts
          set +e
          uv run python -m src.redteam --emit-issue-body
          rc=$?
          set -e
          # Exit code alone can't distinguish clean/scope/fix (all exit 0) or tell a
          # real infra crash from a proper outage (both may exit non-2/3 in edge cases).
          # _write_status() in src/redteam/__main__.py writes {disposition, reason,
          # flag_count} on every path except a hard crash before it's ever reached, so
          # the status file is the authoritative source; the exit code is only the
          # fallback when the file is missing/unparseable (a genuine infra failure).
          disp=""
          reason=""
          # Read the authoritative disposition/reason from the status JSON with jq
          # (installed on the self-hosted runner). Deliberately NOT `uv run python`:
          # this step runs on burrow where uv is not on the login PATH, so shelling
          # out to uv here is a fragile seam — a failed read would silently drop the
          # real disposition and fall through to the exit-code guess.
          if [ -s "$REDTEAM_STATUS_PATH" ]; then
            disp=$(jq -r '.disposition // ""' "$REDTEAM_STATUS_PATH" 2>/dev/null || echo "")
            reason=$(jq -r '.reason // ""' "$REDTEAM_STATUS_PATH" 2>/dev/null || echo "")
          fi
          if [ -z "$disp" ]; then
            # Status file missing/unparseable -> a genuine infra failure. Map the
            # exit code as a last resort; anything unrecognized is infra.
            case $rc in
              0) disp=clean ;;
              3) disp=regression ;;
              2) disp=outage ;;
              *) disp=infra ;;
            esac
          fi
          echo "disposition=$disp" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "body=$REDTEAM_ISSUE_BODY" >> "$GITHUB_OUTPUT"
          # Findings are surfaced as issues in access-redteam, not as a red job.
          # Only a genuine infra failure fails this job; clean/regression/scope/fix/
          # outage all keep it green (a nightly that goes red on every finding just
          # trains everyone to ignore it). The disposition is still recorded above
          # for the downstream issue-filing steps.
          [ "$disp" = "infra" ] && exit 1 || exit 0

      - name: Prune old redteam artifacts (keep last 14 runs)
        if: always()
        run: |
          cd /home/gofer/redteam-artifacts 2>/dev/null || exit 0
          # newest-first; drop everything past the 14 most recent run dirs
          ls -1dt */ 2>/dev/null | tail -n +15 | xargs -r rm -rf

      - name: File/dedup findings in access-redteam
        if: always() && contains(fromJSON('["regression","scope","fix"]'), steps.gate.outputs.disposition)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REDTEAM_FINDINGS_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = 'necyberteam', repo = 'access-redteam';
            const lines = fs.readFileSync(process.env.BODY, 'utf8').split('\n').filter(Boolean);
            // known-jailbreak always `continue`s above before reaching the LABEL
            // lookup below (candidate-fix never files an issue); the entry here is
            // defensive only, so a future fall-through can't silently mislabel via
            // the `|| 'redteam-scope'` fallback.
            const LABEL = { defended: 'redteam-regression', soft: 'redteam-scope', 'known-jailbreak': 'redteam-regression' };
            const date = new Date().toISOString().split('T')[0];
            for (const line of lines) {
              const [tier, kind, promptId, verdict, hash] = line.split('\t');
              const marker = `<!-- redteam-prompt: ${promptId} -->`;
              const found = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue is:open in:body "${marker}"`,
              });
              const openNum = found.data.total_count > 0 ? found.data.items[0].number : null;
              if (tier === 'known-jailbreak') {
                // candidate-fix: the hole is patched. Close the tracking issue if open; do nothing if not.
                if (openNum) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: openNum,
                    body: `Defended again — ${date} (run ${context.runId}). Auto-closing; reopens if it regresses.` });
                  await github.rest.issues.update({ owner, repo, issue_number: openNum, state: 'closed' });
                }
                continue;
              }
              if (openNum) {
                await github.rest.issues.createComment({ owner, repo, issue_number: openNum,
                  body: `Still surfacing — ${date} (run ${context.runId}). ${verdict} ${hash}` });
              } else {
                await github.rest.issues.create({ owner, repo,
                  title: `Red-team ${tier} finding — ${promptId}`,
                  body: `${marker}\n\nTier: ${tier}. ${verdict} ${hash}\nTranscripts on-prem only.`,
                  labels: [LABEL[tier] || 'redteam-scope'] });
              }
            }
        env:
          BODY: ${{ steps.gate.outputs.body }}

      - name: File outage/infra issue in access-redteam
        if: always() && contains(fromJSON('["outage","infra"]'), steps.gate.outputs.disposition)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REDTEAM_FINDINGS_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = 'necyberteam', repo = 'access-redteam';
            const date = new Date().toISOString().split('T')[0];
            const reason = process.env.REASON || '';
            const map = { judge:['Red-team judge outage','redteam-judge-outage'],
                          surface:['Red-team surface outage','redteam-surface-outage'],
                          errored:['Red-team agent outage','redteam-agent-outage'] };
            const [title, label] = map[reason] || ['Red-team gate infra failure','redteam-infra'];
            let body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try { body = fs.readFileSync(process.env.BODY, 'utf8') + `\n\n${body}`; } catch (e) {}
            await github.rest.issues.create({ owner, repo, title: `${title} — ${date}`, body, labels: [label] });
        env:
          BODY: ${{ steps.gate.outputs.body }}
          REASON: ${{ steps.gate.outputs.reason }}
