# Docker Compose file for ACCESS Agent - Production
# Uses pre-built image from GitHub Container Registry

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "9443:443"
      - "9443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - access-agent
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          memory: 128M

  access-agent:
    image: ghcr.io/${GITHUB_REPOSITORY:-necyberteam/access-agent}/access-agent:latest
    # Internal only - Caddy handles external traffic
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - STATIC_LLM_PROVIDER=${STATIC_LLM_PROVIDER:-}
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY:-}
      - FIREWORKS_MODEL=${FIREWORKS_MODEL:-}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langgraph
      - MCP_SERVER_HOST=${MCP_SERVER_HOST:-localhost}
      # Catalog is fetched dynamically from MCP servers at startup
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - agent-network
      - mcp-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: langgraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - agent-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  agent-network:
    driver: bridge
  mcp-network:
    external: true
    name: mcp-network
