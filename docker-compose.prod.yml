# Docker Compose file for ACCESS Agent - Production
# Uses pre-built image from GitHub Container Registry

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "9443:443"
      - "9443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - access-agent
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          memory: 128M

  access-agent:
    image: ghcr.io/${GITHUB_REPOSITORY:-necyberteam/access-agent}/access-agent:latest
    # Internal only - Caddy handles external traffic
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langgraph
      - REDIS_URL=redis://redis:6379/0
      - CITATION_VALIDATION_ENABLED=${CITATION_VALIDATION_ENABLED:-true}
      # RAG-primary architecture: QA service for verified Q&A retrieval
      # Use host.docker.internal for same-host Docker communication
      - QA_SERVICE_URL=${QA_SERVICE_URL:-http://host.docker.internal:8001}
      - RAG_TOP_K=${RAG_TOP_K:-3}
      - RAG_THRESHOLD_STATIC=${RAG_THRESHOLD_STATIC:-0.85}
      - RAG_THRESHOLD_COMBINED=${RAG_THRESHOLD_COMBINED:-0.75}
      - RAG_THRESHOLD_FALLBACK=${RAG_THRESHOLD_FALLBACK:-0.65}
      - MCP_SERVER_HOST=${MCP_SERVER_HOST:-localhost}
      # OpenTelemetry - Honeycomb
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-https://api.honeycomb.io}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - HONEYCOMB_DATASET=${HONEYCOMB_DATASET:-access-ci}
      # Catalog is fetched dynamically from MCP servers at startup
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - agent-network
      - mcp-network

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: langgraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - agent-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - agent-network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  agent-network:
    driver: bridge
  mcp-network:
    external: true
    name: mcp-network
