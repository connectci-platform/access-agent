# Docker Compose file for ACCESS Agent - Production
# Uses pre-built image from GitHub Container Registry

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "9443:443"
      - "9443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - access-agent
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          memory: 128M

  access-agent:
    image: ghcr.io/${GITHUB_REPOSITORY:-connectci-platform/access-agent}/access-agent:latest
    # Internal only - Caddy handles external traffic
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      # vLLM (UKY Qwen) — required when LLM_PROVIDER=vllm. These were always
      # passed by the dev compose but never by prod, so prod silently fell
      # back to the OpenAI default regardless of the droplet .env.
      - VLLM_BASE_URL=${VLLM_BASE_URL:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langgraph
      - REDIS_URL=redis://redis:6379/0
      - CITATION_VALIDATION_ENABLED=${CITATION_VALIDATION_ENABLED:-true}
      # UKY RAG endpoints (dual RAG: general ACCESS Q&A + XDMoD)
      # ACCESS_AI_API_KEY is the canonical credential; UKY_RAG_API_KEY and
      # UKY_CHATMCP_API_KEY are optional per-endpoint overrides that the app
      # falls back from to ACCESS_AI_API_KEY (see config.uky_rag_api_key_resolved).
      - ACCESS_AI_API_KEY=${ACCESS_AI_API_KEY:-}
      - UKY_RAG_ENABLED=${UKY_RAG_ENABLED:-true}
      - UKY_RAG_API_KEY=${UKY_RAG_API_KEY:-}  # Optional override; falls back to ACCESS_AI_API_KEY
      - UKY_RAG_GENERAL_URL=${UKY_RAG_GENERAL_URL:-https://access-ai-grace1-external.ccs.uky.edu/access/chat/api/}
      - UKY_RAG_XDMOD_URL=${UKY_RAG_XDMOD_URL:-https://access-ai-grace1-external.ccs.uky.edu/access/xdmod/chat/api/}
      - UKY_RAG_TIMEOUT=${UKY_RAG_TIMEOUT:-60.0}
      # UKY chat-mcp endpoint for general-corpus chunk retrieval (search_access_documents)
      - UKY_CHATMCP_URL=${UKY_CHATMCP_URL:-https://access-ai-grace1-external.ccs.uky.edu/access/chat-mcp/api/retrieve-docs}
      - UKY_CHATMCP_API_KEY=${UKY_CHATMCP_API_KEY:-}
      - MCP_SERVER_HOST=${MCP_SERVER_HOST:-localhost}
      # MCP API key for servers requiring authentication (announcements, events, jsm)
      - MCP_API_KEY=${MCP_API_KEY:-}
      # Capability gating (comma-separated capability ids). extract_xdmod_data
      # is gated off by default because the xdmod-data MCP server needs a
      # per-user XDMoD token the agent cannot yet obtain; without this the
      # agent picks those tools and surfaces an XDMoD auth error. Remove it
      # once the per-user token flow is in place.
      - DISABLED_CAPABILITIES=${DISABLED_CAPABILITIES:-extract_xdmod_data}
      - ENABLED_CAPABILITIES=${ENABLED_CAPABILITIES:-}
      # JWT Authentication (ES256 + JWKS)
      - TRUSTED_JWKS_URLS=${TRUSTED_JWKS_URLS:-}
      - ALLOW_BODY_ACTING_USER=${ALLOW_BODY_ACTING_USER:-true}
      # OpenTelemetry - Honeycomb
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-https://api.honeycomb.io}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - HONEYCOMB_DATASET=${HONEYCOMB_DATASET:-access-ci}
      # Reporting (GA4 + email delivery)
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID:-}
      - GA4_CREDENTIALS_FILE=${GA4_CREDENTIALS_FILE:-}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - REPORT_EMAIL_FROM=${REPORT_EMAIL_FROM:-reports@mg.sweetandfizzy.com}
      - REPORT_EMAIL_TO=${REPORT_EMAIL_TO:-}
      - REPORT_SLACK_WEBHOOK_URL=${REPORT_SLACK_WEBHOOK_URL:-}
      # Eval judge — empty defaults = OpenAI gpt-4o-mini; the droplet .env
      # points these at the UKY Qwen endpoint with thinking on. Must be listed
      # here (like VLLM_* above) or the .env values never reach the container.
      - EVAL_JUDGE_BASE_URL=${EVAL_JUDGE_BASE_URL:-}
      - EVAL_JUDGE_API_KEY=${EVAL_JUDGE_API_KEY:-}
      - EVAL_JUDGE_MODEL=${EVAL_JUDGE_MODEL:-gpt-4o-mini}
      - EVAL_JUDGE_THINKING=${EVAL_JUDGE_THINKING:-false}
      # Catalog is fetched dynamically from MCP servers at startup
    volumes:
      - ./mghpcc-4626301de758.json:/app/mghpcc-4626301de758.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - agent-network
      - mcp-network

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: langgraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback-only: reachable via SSH tunnel for eval, not from the internet
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - agent-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - agent-network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  agent-network:
    driver: bridge
  mcp-network:
    external: true
    name: mcp-network
