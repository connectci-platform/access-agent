    tool for finding which ACCESS resources have a given software package installed.
  - Answer conveys that SDS is a searchable catalog showing, per package, which resources have
    it installed - i.e. it answers the cross-resource question directly rather than requiring
    the user to check each resource's docs one at a time.
  - Answer mentions at least one correct fallback for software not in the catalog - installing
    into your home directory (pip install --user, conda, spack), using a Singularity/Apptainer
    container, or opening a ticket asking the RP to install it.
  - Answer does not claim SDS covers every ACCESS resource; it indexes only participating reporting
    providers.
  sources:
  - https://support.access-ci.org/documentation/finding-software (verified 2026-09-13)
  - https://sds.access-ci.org/ (verified 2026-09-13)
  authoring_notes:
  - 'DISAGREEMENT: https://sds.access-ci.org/ (verified 2026-09-13) states its reporting providers
    as exactly "ACES, Anvil, Bridges-2, Delta, DeltaAI, Jetstream2, KyRIC, Stampede3" - eight
    resources. The agent''s answer says SDS "indexes software across ACES, Anvil, Bridges-2,
    Delta, DeltaAI, Derecho, Expanse, Jetstream2, KyRIC, Stampede3, Voyager, and others", adding
