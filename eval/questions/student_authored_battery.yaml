    one partition — this is normal Slurm behaviour, not an exception.
  - Answer conveys that partitions impose concurrency caps, expressed as a maximum number of
    running jobs and often also a maximum of running-plus-queued jobs.
  - Answer conveys that the caps vary by resource and by partition, and does not present one
    resource's numbers as an ACCESS-wide limit.
  - Any specific limits the answer cites are correct for the named resource and partition —
    e.g. Expanse compute 32 running / 64 running+queued, Expanse shared 4096 / 4096, Expanse
    gpu 4 / 8; Anvil wholenode 64 running / 2500 running+submitted, Anvil wide 5 / 10, Anvil
    shared capped at 1,280 cores per user, Anvil GPU limits of 12 GPUs per user and 32 GPUs
    per allocation.
  sources:
  - https://www.sdsc.edu/support/user_guides/expanse.html (verified 2026-09-13)
  - https://docs.rcac.purdue.edu/userguides/anvil/jobs/ (verified 2026-09-13)
  authoring_notes:
  - 'AUTHOR: The agent says these limits are "typically per project (allocation), not per user".
    This is resource-dependent and the agent overgeneralizes. The Expanse user guide says its
