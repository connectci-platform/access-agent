# Student-authored question battery — 47 questions submitted by the student
# reviewers, in submission order. Two of the original 49 were dropped as
# duplicates: sa-alloc-10 (same answer as sa-alloc-03) and sa-onboard-06 (same
# as gapfill's gf-docs-01, which already has confirmed facts).
#
# required_facts are DRAFTS, authored 2026-09-13 from authoritative ACCESS and
# resource-provider documentation, NOT from the agent's own answers — grading an
# answer against a rubric derived from it proves nothing. Each carries the source
# URL and verification date. Student reviewers confirm, flag or edit them in the
# dashboard, which is the resolver's source of truth; these are the fallback and
# the reviewable artifact.
#
# authoring_notes starting with AUTHOR: mark claims the sources did not support.
# They are deliberate gaps, not omissions — several agent answers carry specific
# numbers that live on JS-rendered pages, and confirming those from the answer
# text is the circularity this whole exercise avoids.
#
# Notes starting with DISAGREEMENT: are findings. Twelve live sources contradict
# what the agent said, including scratch purge windows off by more than 10x and
# an SSH key-propagation claim the support docs directly refute. Three of the
# twelve are ACCESS pages contradicting each other, not agent errors.
#
# sa-general-02 and sa-resource-09 have no facts yet: both failed their eval run
# on upstream 500s from chat-mcp, so there was no answer to work from.
#
# capability_area and expected_tool are FIRST-PASS GUESSES from the existing
# battery vocabulary, not verified routing. expected_tool: null means the answer
# is expected from document retrieval rather than a live-data tool. Correct these
# as the students' facts reveal what a good answer actually requires.
#
# Several questions are deliberately under-specified ("this cluster", "a slice"),
# because they are real questions asked in real words. Those are worth keeping:
# how the agent handles a missing referent is itself a behavior to grade.

# --- Group 1: onboarding, eligibility, credits, proposals (9) ---

- id: sa-onboard-01
  question: How do I make an ACCESS account?
  capability_area: account_management
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Answer directs the user to register for an ACCESS ID through the official ACCESS account
    registration flow (account.access-ci.org/register, reached via identity.access-ci.org or
    the ACCESS get-started page), not to a resource provider's own signup.
  - Answer conveys that a user can register using an existing institutional/federated identity
    via CILogon, or with an ACCESS-issued username and password, and that whichever identity
    provider you register with is the one you must select at login.
  - Per ACCESS documentation, former XSEDE users must not create a new account - the ACCESS
    ID is the same as the XSEDE Portal account username, with the same password and Duo registration.
    Answer states this rather than telling XSEDE users to register fresh.
  - Answer does not claim ACCESS account creation requires an allocation, a grant, or a fee.
  sources:
  - https://support.access-ci.org/documentation/your-access-account (verified 2026-09-13)
  - https://operations.access-ci.org/identity/faq (verified 2026-09-13)
  - https://allocations.access-ci.org/get-your-first-project (verified 2026-09-13)
  authoring_notes:
  - 'AUTHOR: The answer cites identity.access-ci.org/new-user-federated and identity.access-ci.org/new-user-direct
    as the two registration URLs. Both currently return a redirect stub pointing at https://account.access-ci.org/register
    (checked 2026-09-13), and the live ACCESS Support account page links only to the account.access-ci.org
    registration flow. I could not confirm the two split URLs are still the documented entry
    points, so fact 1 grades the destination rather than the exact URL. A human should decide
    whether citing the older new-user-federated / new-user-direct URLs should count against
    an answer.'

- id: sa-alloc-01
  question: How do I get an allocation on ACCESS?
  capability_area: allocations
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Answer names the four ACCESS allocation opportunities by name — Explore, Discover, Accelerate,
    Maximize — as the tiers a researcher chooses between.
  - Answer states that an ACCESS ID / ACCESS account is a prerequisite before requesting an
    allocation, and points to registration (identity.access-ci.org or the ACCESS account registration
    page).
  - Answer conveys that Explore, Discover and Accelerate can be submitted at any time (rolling)
    while Maximize is only accepted in periodic windows (every six months / semi-annual). Does
    not claim Maximize is submittable anytime.
  - Answer does not claim allocations are requested per-resource up front; awards for Explore/Discover/Accelerate
    are made in ACCESS Credits that are later exchanged for resource units.
  sources:
  - https://allocations.access-ci.org/project-types (verified 2026-09-13)
  - https://allocations.access-ci.org/allocations-policy (verified 2026-09-13)
  - https://allocations.access-ci.org/how-to (verified 2026-09-13)
  authoring_notes:
  - 'AUTHOR: The agent states Explore turnaround is "as little as 1-2 business days". allocations-policy
    says only that Explore/Discover/Accelerate are "typically reviewed and processed within
    two weeks of submission"; project-types gives no turnaround at all. The 1-2 business day
    figure could not be verified on any allocations.access-ci.org page. A human should confirm
    whether ACCESS publishes that number anywhere before it is graded either way. Not written
    as a required fact.'
  - 'AUTHOR: The agent says Explore "requires only an abstract". prepare-requests says Explore
    requires no formal project description but still requires a project summary, PI/co-PI CVs
    (2-page max), project info, and a signed advisor letter for graduate students. "Only an
    abstract" understates this. Left out of the facts because the question is broad; consider
    adding a document-requirements fact if this question is meant to test that.'

- id: sa-onboard-02
  question: How do I log into ACCESS?
  capability_area: account_management
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Answer states that login goes through CILogon, where the user selects an identity provider
    — either "ACCESS CI (XSEDE)" for an ACCESS ID and password, or their own university/institution
    if it is listed.
  - Answer conveys that the identity provider chosen at login must be the same one used at registration.
  - Answer conveys that MFA is required, and does not claim Duo specifically is required on
    every ACCESS login — Duo applies when logging in with the ACCESS CI (XSEDE) identity provider,
    whereas an institutional login uses that institution's MFA.
  sources:
  - https://operations.access-ci.org/faqs/account-setup-and-management (verified 2026-09-13)
  - https://support.access-ci.org/documentation/your-access-account (verified 2026-09-13)
  authoring_notes:
  - 'DISAGREEMENT: https://operations.access-ci.org/faqs/account-setup-and-management (verified
    2026-09-13) states "If you are using \"ACCESS CI (XSEDE)\" to login you will be using Duo
    for MFA. If you login with your university account you will use your university MFA." The
    agent''s answer says "ACCESS requires MFA on every login. Complete the Duo prompt", presenting
    Duo as universal. Duo is specific to the ACCESS CI identity provider, not to every ACCESS
    login path.'
  - 'AUTHOR: The agent instructs the user to start at https://portal.access-ci.org. That host
    was not verified as the canonical entry point; ACCESS support documents account actions
    under support.access-ci.org and account.access-ci.org, and the identity FAQ links CILogon
    directly. A human should confirm whether portal.access-ci.org is current before an answer
    is penalized or credited for it. No fact requires a particular entry URL.'

- id: sa-onboard-03
  question: Who is eligible to use ACCESS?
  capability_area: documentation
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Answer states that leading an allocation requires being a U.S.-based researcher or educator
    at the graduate-student level or higher, at a two- or four-year post-secondary institution.
  - Answer states the PI must use an organizational email matching their listed affiliation;
    public domains such as gmail.com are not accepted.
  - Answer does not claim undergraduates, K-12 students, or unaffiliated or retired individuals
    can lead an allocation.
  sources:
  - https://allocations.access-ci.org/allocations-policy (verified 2026-09-13)

- id: sa-alloc-02
  question: How do I see how many credits I have left on ACCESS?
  capability_area: allocations
  battery: student_authored
  expected_tool: get_my_rp_accounts
  required_facts:
  - Answer directs the user to log in to the ACCESS Allocations portal at allocations.access-ci.org
    (not to a resource provider site or a support ticket) to see their credit balance.
  - Answer names the "Credits + Resources" tab (or equivalently the My Projects screen leading
    to it) as where the credit/resource balance is shown.
  - Answer does not claim the Exchange Calculator page shows the user's own remaining balance;
    that page is a conversion tool only. Mentioning it purely as background on how credits convert
    to resource units is acceptable.
  sources:
  - https://allocations.access-ci.org/how-to (verified 2026-09-13)
  - https://allocations.access-ci.org/exchange_calculator (verified 2026-09-13)

- id: sa-alloc-03
  question: How do I get more credits on ACCESS?
  capability_area: allocations
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Answer identifies the mechanism as a supplement request submitted through the ACCESS allocations
    portal (allocations.access-ci.org), not a new proposal or a support ticket.
  - Answer conveys that Explore/Discover/Accelerate projects are initially awarded only half
    the project type's ACCESS Credit limit, and the supplement is how the remaining half is
    requested once the project is underway.
  - Answer notes a progress report / justification is required with the supplement request.
  - Answer does not claim credits are granted automatically or that a supplement is unlimited;
    for Explore/Discover/Accelerate the supplement is bounded by the project type's credit limit
    (upgrading to a larger project type is the path beyond it).
  sources:
  - https://allocations.access-ci.org/how-to (verified 2026-09-13)
  - https://allocations.access-ci.org/allocations-policy (verified 2026-09-13)
  authoring_notes:
  - 'AUTHOR: The source is ambiguous about whether a supplement can exceed the half-not-yet-granted
    amount. allocations-policy describes a "one-time increase of up to half the current ACCESS
    Credit limit"; the how-to frames it purely as "request the other half of your project''s
    credits". A human should decide whether a correct answer must distinguish these, or whether
    "request the remaining half" is sufficient. Fact 4 is written conservatively to avoid grading
    on this ambiguity.'

- id: sa-alloc-04
  question: How do I write a proposal to use ACCESS?
  capability_area: allocations
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Answer states the project-description page limit for Discover is one page and for Accelerate
    is three pages, per prepare-requests. Answer does not inflate the Accelerate limit (e.g.
    to 3-5 pages).
  - Answer states that two-page (maximum) CVs are required for the PI and each co-PI, in PDF.
  - Answer states that a graduate student requesting a project must supply a signed letter from
    their advisor on institutional letterhead.
  - Answer conveys that Maximize requires a substantially larger package than the other tiers
    — a 10-page main document plus supporting documents (e.g. 3-page progress report for renewals,
    5-page code performance/resource-costs section).
  sources:
  - https://allocations.access-ci.org/prepare-requests (verified 2026-09-13)
  - https://allocations.access-ci.org/project-types (verified 2026-09-13)
  authoring_notes:
  - 'DISAGREEMENT: https://allocations.access-ci.org/prepare-requests (verified 2026-09-13)
    states the Accelerate project description is "A three-page description of the project".
    The agent''s answer for sa-alloc-01 says Accelerate "Requires a 3-5 page project description".
    Three pages is the documented maximum; 3-5 pages is wrong.'
  - 'DISAGREEMENT: https://allocations.access-ci.org/project-types (verified 2026-09-13) labels
    the tiers with different proposal lengths than prepare-requests: project-types lists Explore
    "1-page proposal", Discover "3-page proposal (max. length)", Accelerate "10-page proposal
    (max. length)", Maximize "10-page proposal (max. length)". prepare-requests says Explore
    has no formal project description, Discover is one page, Accelerate is three pages, Maximize
    is a 10-page main document. These two official ACCESS pages contradict each other on Discover
    and Accelerate. I graded against prepare-requests because it is the page that gives the
    detailed per-document formatting rules, but a human should resolve which page is authoritative
    before this fact is used to score a national-project metric.'

- id: sa-alloc-05
  question: How long does it take for them to review my access proposal?
  capability_area: allocations
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Per the ACCESS allocations policy, Explore, Discover and Accelerate requests are accepted
    continuously and are typically reviewed and processed within two weeks of submission.
  - Answer distinguishes Maximize ACCESS as a separate, semi-annual cycle with a substantially
    longer timeline rather than applying the two-week figure to all request types.
  - If the answer gives specific Maximize cycle dates, they match the published cycle (window
    opens Jun 15, closes Jul 31, review meeting Aug 31, notifications mid-September, start Oct
    1; and window opens Dec 15, closes Jan 31, review meeting Mar 8, notifications mid-March,
    start Apr 1).
  sources:
  - https://allocations.access-ci.org/allocations-policy (verified 2026-09-13)
  - https://allocations.access-ci.org/prepare-requests (verified 2026-09-13)
  authoring_notes:
  - 'AUTHOR: support.access-ci.org/announcements/upcoming-allocation-request-periods lists a
    DIFFERENT Maximize cycle (opens Mar 15, closes Apr 15, review early June, notifications
    mid-June, start Jul 1; second cycle opens Jun 15, closes Jul 15, start Oct 1) than allocations.access-ci.org/prepare-requests.
    The announcements page is probably stale, but a human should confirm which cycle calendar
    is current before this fact is used to fail an answer that cites the other set of dates.'

- id: sa-alloc-06
  question: How much does it cost to use ACCESS?
  capability_area: allocations
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Answer states there is no cost to the researcher for ACCESS allocations, which are NSF-funded.
  - Answer does not quote a price, rate, or fee schedule for ACCESS resources.
  sources:
  - https://allocations.access-ci.org/project-types (verified 2026-09-13, tiers only)
  authoring_notes:
  - 'AUTHOR: the no-cost claim is NOT stated on allocations-policy or project-types. Find the
    authoritative page that says so, or reword.'

# --- Group 2: cluster mechanics, asked with an unresolved referent (8) ---
# "this cluster" / "this system" have no antecedent in a single-turn eval. Kept
# verbatim: whether the agent asks which resource or silently assumes one is a
# real behavior to grade, not a defect in the question.

- id: sa-cluster-01
  question: How do I add my SSH key to this cluster?
  capability_area: compute_resources
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Answer explains that ACCESS provides a central SSH public key registry tied to your ACCESS
    ID rather than requiring you to edit authorized_keys on each machine, and names the correct
    entry point (operations.access-ci.org/identity/ssh-pubkey, account.access-ci.org, or registry.access-ci.org).
  - Answer does not claim that a key registered centrally is automatically propagated to every
    ACCESS resource provider. Per ACCESS support documentation, RPs pull the stored key when
    activating an account, and several RPs use their own path instead (their own web portal
    with ACCESS or RP-specific credentials, ACCESS OnDemand, or emailing the key to RP support).
  - Answer either asks which resource the user means or explicitly says the exact procedure
    varies by resource provider, rather than presenting one RP's procedure as universal. The
    question says "this cluster" with no resource named.
  sources:
  - https://support.access-ci.org/documentation/ssh-login (verified 2026-09-13)
  - https://operations.access-ci.org/identity/ssh-pubkey (verified 2026-09-13)
  authoring_notes:
  - 'DISAGREEMENT: https://support.access-ci.org/documentation/ssh-login says ACCESS stores
    the key and RPs pull it when activating your account, and lists five distinct upload methods
    including RP web portals with RP-specific logins and emailing the key to RP support. The
    agent answer said the key is "automatically propagated to all ACCESS resource providers
    that support ACCESS-managed identity". The source does not support automatic propagation
    to all RPs. The agent also gave registry.access-ci.org as the sole entry point, while the
    support documentation points to operations.access-ci.org/identity/ssh-pubkey and account.access-ci.org.'

- id: sa-cluster-02
  question: Does this system use the standard module load command for packages?
  capability_area: software
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - The question names no resource ("this system"). Answer either asks which ACCESS resource
    the user means, or makes clear that the answer is resource-dependent, rather than silently
    assuming one specific system.
  - Answer conveys that environment modules with the `module load` command are the standard
    mechanism for loading software on ACCESS HPC resources, and gives at least one correct companion
    command (module avail, module list, module spider, or module purge).
  - Answer does not assert that every ACCESS resource uses Lmod or module load. Cloud resources
    in the ACCESS portfolio, notably Jetstream2, are VM/instance platforms rather than module-based
    HPC clusters.
  sources:
  - https://support.access-ci.org/documentation/finding-software (verified 2026-09-13)
  - https://docs.rcac.purdue.edu/userguides/anvil/anvil-software/ (verified 2026-09-13)
  - https://docs.jetstream-cloud.org/ (verified 2026-09-13)
  authoring_notes:
  - 'DISAGREEMENT: The agent''s answer opens "Yes. All ACCESS-CI resources use Lmod, the standard
    hierarchical module system". That universal is not supported. The ACCESS Support software
    page (https://support.access-ci.org/documentation/finding-software, verified 2026-09-13)
    says software is loaded using "the Environment Modules system" without asserting Lmod everywhere,
    and https://docs.jetstream-cloud.org/ (verified 2026-09-13) describes Jetstream2 as "a user-friendly
    cloud computing environment" where users provision VM instances, not a module-based cluster.
    The companion scheduler page (https://support.access-ci.org/documentation/schedulers) makes
    the parallel point explicitly for schedulers: "Most ACCESS resources use Slurm, but not
    all." Fact 3 is the negative guard.'
  - 'AUTHOR: The answer''s per-resource table claims REPACSS (Texas Tech) uses "Lmod + Spack"
    and Launch (TAMU) uses hierarchical toolchains. I did not verify REPACSS or Launch against
    authoritative RP documentation - REPACSS has no page on the allowed-domain list, and I did
    not reach an hprc.tamu.edu Launch software page. A human should confirm those two rows if
    the rubric is ever tightened to grade per-resource module-system claims.'

- id: sa-cluster-03
  question: How can I see the status for the queues of the cluster?
  capability_area: compute_resources
  battery: student_authored
  expected_tool: get_resource_hardware
  required_facts:
  - Answer recognizes the question is resource-dependent, or at minimum states which scheduler/cluster
    its commands apply to, rather than presenting one command as universal across ACCESS.
  - Answer gives sinfo as the Slurm command for partition/queue status and squeue for job status
    on Slurm-based ACCESS resources.
  - Answer does not claim a single ACCESS-wide queue-status command or web page exists that
    works for every resource.
  sources:
  - https://docs.tacc.utexas.edu/hpc/stampede3/ (verified 2026-09-13)
  - https://docs.ncsa.illinois.edu/systems/delta/en/latest/user_guide/running_jobs.html (verified
    2026-09-13)
  - https://docs.rcac.purdue.edu/userguides/anvil/jobs/ (verified 2026-09-13)
  authoring_notes:
  - 'AUTHOR: The question says "the cluster" with no named resource, so it is partly a clarification
    test. Facts are written to reward either asking which resource or explicitly scoping the
    answer per scheduler. A grader should not penalize an answer that asks for the resource
    name instead of listing commands.'
  - 'AUTHOR: qlimits and showq are confirmed TACC-specific utilities (docs.tacc.utexas.edu/hpc/stampede3/).
    Anvil documents showpartitions (docs.rcac.purdue.edu/userguides/anvil/jobs/) and Delta documents
    sview. The agent presents qlimits under a heading "Slurm-based TACC systems", which is correct
    scoping. The agent''s PBS/Derecho qstat -Q section was not verified against NCAR docs, which
    are outside the allowed domain list.'

- id: sa-cluster-04
  question: If my job script is submitted correctly and I have the number, where can I see the log file?
  capability_area: documentation
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - For a Slurm batch job with no output directive, answer states the default output file is
    slurm-<jobid>.out written in the directory the job was submitted from, and that stdout and
    stderr both go there unless separated.
  - 'Answer notes that an explicit #SBATCH --output (and/or --error) directive in the script
    overrides the default location and name.'
  - Answer does not assume a single named cluster's specifics as universal; the question names
    no resource, so it either asks which resource or frames the answer around the scheduler
    in use.
  sources:
  - https://docs.rcac.purdue.edu/userguides/anvil/jobs/ (verified 2026-09-13)
  authoring_notes:
  - 'AUTHOR: The agent suggested `scontrol show job <jobid>` and reading its StdOut/StdErr fields.
    The Anvil job guide documents scontrol show job as giving useful job information but does
    not itself list StdOut/StdErr among the displayed fields. The claim is true of stock Slurm
    but was not verified against an ACCESS-domain source; do not fail an answer for including
    it, and a human may want to confirm before making it a required fact.'

- id: sa-storage-01
  question: How long are my files saved for after my allocation ends?
  capability_area: documentation
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Answer states that retention depends on the storage system and resource rather than giving
    one global figure, and does not claim files are deleted immediately when an allocation ends.
  - Per ACCESS data and storage documentation, archival and stand-alone storage is retained
    for a defined grace period past allocation expiry, specifically Ranch (TACC) 6 months, and
    Ocean (PSC) and Expanse (SDSC) 3 months. Any specific retention figures the answer gives
    for these systems match these.
  - Answer conveys that scratch is purged on an access-age basis independent of the allocation
    end date, and that scratch and project space are generally not backed up, so users should
    move data they need off the system.
  sources:
  - https://support.access-ci.org/documentation/data-and-storage (verified 2026-09-13)
  authoring_notes:
  - 'AUTHOR: The agent gave NCAR Derecho specifics (scratch purged after 180 days of no access,
    campaign storage 90 days after project expiry, $HOME for the life of the account, $WORK
    not age-purged). Those were not verified; ncar-hpc-docs is outside the allowed domain list.
    The ACCESS data-and-storage page gives a generic scratch purge window of typically 30 to
    90 days depending on resource. A human should decide whether Derecho-specific numbers belong
    here.'

- id: sa-storage-02
  question: Is the storage on this cluster long term or short term, and if I need long term, where should I put it?
  capability_area: compute_resources
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - The question says "this cluster" with no named resource. Answer either asks which resource
    the user means, or answers in a way that is explicitly general across ACCESS compute resources,
    rather than silently assuming one system.
  - Answer conveys that compute-resource storage is for active computation and is not archival
    - on Delta the documentation states plainly that it "does not provide storage resources
    for archiving data or other long-term storage".
  - Answer conveys that scratch/project filesystems are generally not backed up and are subject
    to purge or quota policies, so users must not treat them as the only copy of their data.
  - Answer conveys that data must be moved off the resource for long-term retention, and names
    a concrete route for doing so - Globus transfer to institutional or archival storage being
    the documented mechanism on ACCESS resources.
  sources:
  - https://docs.ncsa.illinois.edu/systems/delta/en/latest/user_guide/data_mgmt.html (verified
    2026-09-13)
  authoring_notes:
  - 'AUTHOR: The 30-day grace period after project expiration IS confirmed for Delta ("There
    is a 30-day grace period for expired Delta projects to allow for data management access
    only"), but the agent presents it as a general ACCESS pattern ("you typically get 30 days").
    I did not verify a 30-day grace period on Anvil, Bridges-2, Expanse, or Stampede3, so I
    left it out of the required facts rather than grade a possibly resource-specific number
    as universal. A human should check two or three other RPs if they want a grace-period fact.'
  - 'AUTHOR: One nuance the answer gets slightly wrong. Delta''s filesystem table shows /u (HOME)
    DOES have snapshots ("Yes (30 days)"), while /projects is "No/TBA" and /work is "No". The
    answer''s claim of "no backups, no snapshots" is correct for /work/hdd and /projects but
    would be wrong if generalized to home. Not encoded as a fact because the question is about
    long-term versus short-term rather than snapshot inventory.'

- id: sa-alloc-07
  question: What are the different tiers of access allocations, and how do I know which one to ask for?
  capability_area: allocations
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Answer names all four project types - Explore, Discover, Accelerate, Maximize - as the allocation
    tiers.
  - Per allocations.access-ci.org/project-types the ACCESS Credit limits are Explore 400,000,
    Discover 1,500,000, Accelerate 3,000,000; Maximize is awarded in resource units rather than
    ACCESS Credits. Answer gets these amounts substantially right.
  - Answer conveys that Explore/Discover/Accelerate can be requested at any time with multiple
    requests allowed, while Maximize is accepted only every 6 months and is limited to one request
    (with some exceptions).
  - Answer conveys the review distinction - Explore and Discover are checked for eligibility
    and suitability of requested resources, while Accelerate and Maximize get panel merit review.
  sources:
  - https://allocations.access-ci.org/project-types (verified 2026-09-13)
  - https://allocations.access-ci.org/allocations-policy (verified 2026-09-13)
  authoring_notes:
  - 'DISAGREEMENT: https://allocations.access-ci.org/project-types (verified 2026-09-13) gives
    the proposal-length ladder as Explore = "Overview" (abstract, no page count), Discover =
    "1-page proposal", Accelerate = "3-page proposal (max. length)", Maximize = "10-page proposal
    (max. length)". The agent''s answer gives Explore = "Summary + CVs", Discover = "1 page
    + CVs", Accelerate = "3 pages + CVs", Maximize = "10-15 pages + CVs + progress report +
    code performance data". The Discover and Accelerate page counts match, but the answer''s
    "10-15 pages" for Maximize overstates the documented 10-page maximum. I deliberately did
    NOT write a required_fact on proposal page lengths because of this; a human should confirm
    the Maximize page limit against the current Prepare Requests page before adding one.'
