- id: sa-alloc-13
  question: How do I request an extension of the end date for my current ACCESS allocation?
  capability_area: allocations
  battery: student_authored
  expected_tool: search_docs
  required_facts:
  - Answer directs the user to request the extension in the allocations portal via the "Extend
    End Date" button on the project, rather than by email or a new proposal.
  - Per allocations.access-ci.org/how-to, extensions can only be requested when 90 days or less
    remain on an active project. Answer states this timing constraint.
  - Answer conveys that the extension length depends on whether the project has a supporting
    grant - a grant-supported project can be extended out to the end of the award (including
    a no-cost extension), while a project with no supporting grant can be extended in 12-month
    increments.
  - Answer does not claim the extension is automatic or granted on request; a reason must be
    supplied and a decision is returned separately.
  sources:
  - https://allocations.access-ci.org/how-to (verified 2026-09-13)
  - https://allocations.access-ci.org/allocations-policy (verified 2026-09-13)
  authoring_notes:
  - 'DISAGREEMENT: The agent''s answer says "Explore, Discover, or Accelerate projects with
    funding: Up to 6 months past the end of your funding award". Neither source supports "past
    the end of". https://allocations.access-ci.org/how-to (verified 2026-09-13) says a grant-supported
    project can be extended "out to the end of the award - including if you have received a
    no-cost extension to the award", i.e. up to the award end, not beyond it. https://allocations.access-ci.org/allocations-policy
    (verified 2026-09-13) says non-grant credit projects get "12-month extensions, up to a total
    of five years", and separately that the six-month extension applies to Maximize: "With a
    brief explanation, a PI can request up to a six-month extension". The answer appears to
    have attached the Maximize six-month rule to funded Explore/Discover/Accelerate projects.
    Fact 3 is written to the sources, so the answer should fail it.'

