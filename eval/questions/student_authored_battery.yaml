# Student-authored question battery — 49 questions submitted by the student
# reviewers in four groups (9 / 8 / 10 / 22), preserved in submission order.
#
# required_facts is DELIBERATELY ABSENT on every entry. These questions exist so
# the students can author their own required_facts in the dashboard
# (/dashboard/facts), which is the source of truth: the eval's fact resolver
# reads reporting.question_facts and falls back to a battery's required_facts
# only when the table has no facts for the question. Seeding a question with no
# facts creates the reporting.questions row and zero fact rows, which is what
# puts it in front of a student with an empty fact list to fill.
#
# capability_area and expected_tool are FIRST-PASS GUESSES from the existing
# battery vocabulary, not verified routing. expected_tool: null means the answer
# is expected from document retrieval rather than a live-data tool. Correct these
# as the students' facts reveal what a good answer actually requires.
#
# Several questions are deliberately under-specified ("this cluster", "a slice"),
# because they are real questions asked in real words. Those are worth keeping:
# how the agent handles a missing referent is itself a behavior to grade.

