# Multi-turn support battery — 9 threads, 2 per core scenario + 1 mixed.
# Scenario tags: followup | clarification | action | topic_switch | mixed.
# Facts are STUDENT-CHECK first pass; AUTHOR: markers need live values filled at
# authoring time (same convention as gapfill_battery.yaml). Facts on dependent turns
# MUST be checkable from prior ANSWER TEXT alone (judge never sees prior tool results).
# Threads tagged acting_user_required need --acting-user with the eval test account.
#
# Every fact carries an explicit fact_id (<thread_id>-<turn_id>-<slug>) — identity is
# the id, never the position, so facts can be reordered, deleted, or inserted here
# without remapping anything in reporting.question_facts.

- thread_id: mt-followup-01
  description: Follow-up dependency over compute hardware — references must resolve across turns.
  scenario: followup
  questions:
  - turn_id: t1
    question: Which ACCESS resources are good for GPU workloads? I need NVIDIA GPUs.
    required_facts:
    - fact_id: mt-followup-01-t1-gpu-resources
      fact_text: "Answer names at least two real NVIDIA-GPU ACCESS resources. Any resource named
        must appear in this turn's tool results, or be one of: Delta, DeltaAI, Anvil, Bridges-2,
        Expanse, Stampede3, Jetstream2, ACES, REPACSS, Launch (GPU-flagged as of 2026-08-12).
        Resources meeting neither test count against this fact."
    ground_truth_stability: time_bound
    authoring_notes: ["Verified 2026-08-12 via search_resources(has_gpu=true): 14 GPU resources incl.
        Delta (A100/A40/H200), DeltaAI (GH200), Anvil (A100; H100 on Anvil AI). STUDENT-CHECK; re-verify at eval time."]
  - turn_id: t2
    question: Which of those have A100s specifically?
    required_facts:
    - fact_id: mt-followup-01-t2-subset
      fact_text: "Answer is a subset of the resources named in the previous answer (reference resolution:
        'those' = t1's list), filtered to A100. If the t1 answer named Delta and/or Anvil, they belong
        in the A100 subset (both have A100s per the hardware catalog as of 2026-08-12)."
    - fact_id: mt-followup-01-t2-no-new-resources
      fact_text: Answer does not introduce resources absent from the t1 answer without flagging the addition.
    ground_truth_stability: time_bound
    authoring_notes: ["Delta: 440 A100s; Anvil GPU: 16x4 A100, verified 2026-08-12."]
  - turn_id: t3
    question: What's the maximum job walltime on the first one you mentioned?
    required_facts:
    - fact_id: mt-followup-01-t3-walltime-first
      fact_text: Answer gives the maximum walltime for the FIRST resource named in the t2 answer
        (positional reference resolution). If that resource is Delta, the standard batch partitions'
        max walltime is 48 hours (interactive partitions 1 hour), per NCSA Delta docs as of 2026-08-12.
    ground_truth_stability: time_bound
    authoring_notes: ["Delta anchor verified 2026-08-12 (docs.ncsa.illinois.edu running_jobs: 48 hr
        on cpu/gpuA100x4/etc., 1 hr interactive). If the live referent is not Delta, verify that
        resource's walltime at eval time. STUDENT-CHECK."]

- thread_id: mt-followup-02
  description: Follow-up dependency over events — a different capability area than followup-01.
  scenario: followup
  questions:
  - turn_id: t1
    question: What ACCESS training events are coming up in the next month?
    required_facts:
    - fact_id: mt-followup-02-t1-upcoming-events
      fact_text: 'Answer lists real upcoming training events, each supported by this turn''s tool
        results, and fabricates none. Anchors as of 2026-08-12 (sufficient but not necessary — an
        answer naming different real events from the tool results is equally correct): "Getting
        Started with Batch Job Scheduling (COMPLECS)" Aug 20, "Anton 3 Capabilities and Enhanced
        Sampling Techniques" Aug 24, "How to Write a Successful Anton Proposal" Aug 24, "Linux tools
        for text processing (COMPLECS)" Sep 3.'
    ground_truth_stability: time_bound
    authoring_notes: ["Verified 2026-08-12 via search_events(type=training, end_date=+1month).
        Highly time-bound — MUST re-verify shortly before each eval run. STUDENT-CHECK."]
  - turn_id: t2
    question: Which of those are virtual?
    required_facts:
    - fact_id: mt-followup-02-t2-virtual-subset
      fact_text: Answer filters the t1 answer's events to virtual/online ones and does not invent
        events not named in t1's answer. (As of 2026-08-12 all four anchor training events are
        virtual — Zoom/Virtual locations — so an answer listing t1's events as all-virtual is correct.)
    ground_truth_stability: time_bound
  - turn_id: t3
    question: How do I sign up for the first virtual one?
    required_facts:
    - fact_id: mt-followup-02-t3-registration
      fact_text: Answer gives registration guidance for the first virtual event from the t2 answer,
        matching that event's actual registration mechanism as shown in this turn's tool results
        (for the Aug 20 COMPLECS anchor as of 2026-08-12 that was an external SDSC registration page
        rather than ACCESS-native registration). It does not invent a registration path.
    ground_truth_stability: time_bound
    authoring_notes: ["Anchor event's access_registration.enabled=false; registration_url on sdsc.edu.
        Re-verify referent event + mechanism at eval time. STUDENT-CHECK."]

- thread_id: mt-clarify-01
  description: Underspecified allocation ask — agent should surface the ambiguity before answering.
  scenario: clarification
  questions:
  - turn_id: t1
    question: Can I get more time?
    required_facts:
    - fact_id: mt-clarify-01-t1-surfaces-ambiguity
      fact_text: Answer surfaces the ambiguity (more compute credits/allocation vs. longer job walltime
        vs. allocation extension) or asks which the user means.
    - fact_id: mt-clarify-01-t1-no-confident-guess
      fact_text: Answer does NOT confidently answer exactly one interpretation as if it were the only one.
    ground_truth_stability: stable
  - turn_id: t2
    question: I mean my allocation on Delta is running low — how do I get more credits?
    required_facts:
    - fact_id: mt-clarify-01-t2-more-credits-path
      fact_text: Answer describes getting more capacity on an existing ACCESS-tier project via
        exchanging remaining ACCESS Credits for additional Delta time (allocations.access-ci.org,
        exchange request from My Projects) and/or moving up to a larger tier with a progress report.
    - fact_id: mt-clarify-01-t2-no-supplement-claim
      fact_text: Answer does not claim a "supplement" is available — supplements are not allowed in
        the Explore, Discover, or Accelerate tiers.
    - fact_id: mt-clarify-01-t2-not-new-allocation
      fact_text: Answer is specific to adding capacity to an existing project, not applying for a new one.
    ground_truth_stability: stable
    authoring_notes: ["Verified 2026-08-12: Anvil/ACCESS docs state 'Supplements are not allowed in
        Explore, Discover, or Accelerate — if you run out, you move up a tier'; exchange requests
        from My Projects; RPs may approve/modify/decline exchanges. STUDENT-CHECK."]
  - turn_id: t3
    question: How long does that usually take to be approved?
    required_facts:
    - fact_id: mt-clarify-01-t3-timeline
      fact_text: "If t2's answer described moving up a tier: Explore and Discover requests are
        reviewed on a rolling basis (usually within about a week) and Accelerate monthly, per ACCESS
        docs as of 2026-08-12. If it described a Credit exchange: the answer should not invent a
        firm turnaround (docs publish none)."
    ground_truth_stability: stable

# 2 turns is deliberate here: the clarification scenario completes naturally once the
# user disambiguates and gets an answer (spec's 3-5 turn guidance is a range, not a floor).
- thread_id: mt-clarify-02
  description: Underspecified access ask — 'get access' has several meanings.
  scenario: clarification
  questions:
  - turn_id: t1
    question: How do I get access?
    required_facts:
    - fact_id: mt-clarify-02-t1-surfaces-ambiguity
      fact_text: Answer surfaces the ambiguity (ACCESS account vs. an allocation vs. login access to a
        specific resource) or asks which the user means.
    ground_truth_stability: stable
  - turn_id: t2
    question: Sorry — I already have an ACCESS account and an allocation. I need to actually log into Anvil.
    required_facts:
    - fact_id: mt-clarify-02-t2-username-prefix
      fact_text: "Anvil usernames carry the x- prefix (x-<ACCESSusername>), per Purdue RCAC docs as
        of 2026-08-12."
    - fact_id: mt-clarify-02-t2-ssh-key
      fact_text: "SSH access is to anvil.rcac.purdue.edu with a REGISTERED SSH KEY; password SSH is
        not supported."
    - fact_id: mt-clarify-02-t2-ood-path
      fact_text: "Open OnDemand at ondemand.anvil.rcac.purdue.edu accepts ACCESS credentials + Duo
        and is the recommended first login (from which the SSH key is registered). Mentioning
        ThinLinc is a bonus, not required."
    - fact_id: mt-clarify-02-t2-no-ruled-out-repeat
      fact_text: Answer does not re-explain account creation or allocation application (already ruled out).
    ground_truth_stability: stable

- thread_id: mt-action-01
  description: Lookup then authenticated action-shaped read — needs the eval test account.
  scenario: action
  acting_user_required: true
  questions:
  - turn_id: t1
    question: What ACCESS training events are coming up on GPU or AI topics?
    required_facts:
    - fact_id: mt-action-01-t1-gpu-ai-events
      fact_text: 'Answer lists real upcoming GPU/AI-related events and does not fabricate any. Anchors
        as of 2026-08-12 (sparse in the current window): "CU RMACC Webinar: Designing and Implementing
        Your Classroom AI Policy" (Aug 11) and "EduHPC 2026" (Nov 15); an honest "few GPU-specific
        events right now" answer naming what exists is correct.'
    ground_truth_stability: time_bound
  - turn_id: t2
    question: Am I registered for any of those?
    required_facts:
    - fact_id: mt-action-01-t2-registration-join
      fact_text: "Answer joins the t1 events against get_my_registrations for the acting user. If no
        registration tool was called this turn, this fact is 'no'. (AUTHOR: pending test-account seeding)"
    - fact_id: mt-action-01-t2-real-state
      fact_text: Answer reflects the actual registration state; does not guess or claim inability to check.
    ground_truth_stability: time_bound
    authoring_notes: ["AUTHOR: seed one registration for the test account so the t1 events overlap
        is non-trivial when this fact is authored."]
  - turn_id: t3
    question: What else am I registered for?
    required_facts:
    - fact_id: mt-action-01-t3-other-registrations
      fact_text: "Answer lists the test account's other registrations per get_my_registrations.
        (AUTHOR: pending test-account seeding)"
    ground_truth_stability: time_bound
    authoring_notes: ["AUTHOR: seed the test account's registration list and enumerate it here,
        excluding registrations already discussed in t2."]

# 2 turns is deliberate here: the inverted-dependency scenario (authenticated read ->
# dependent lookup) completes naturally in two turns (spec's 3-5 turn guidance is a range).
- thread_id: mt-action-02
  description: Authenticated read first, then a dependent public lookup — inverted dependency.
  scenario: action
  acting_user_required: true
  questions:
  - turn_id: t1
    question: What events am I currently registered for?
    required_facts:
    - fact_id: mt-action-02-t1-my-registrations
      fact_text: "Answer lists the test account's registrations per get_my_registrations.
        (AUTHOR: pending test-account seeding)"
    ground_truth_stability: time_bound
    authoring_notes: ["AUTHOR: seed the test account's registration list and enumerate it here."]
  - turn_id: t2
    question: Are there other upcoming events similar to the first one on that list?
    required_facts:
    - fact_id: mt-action-02-t2-similar-to-first
      fact_text: "Answer names at least one real upcoming event (present in this turn's tool results)
        and states how it relates to the first registration named in t1's answer. (AUTHOR: pending
        test-account seeding)"
    ground_truth_stability: time_bound
    authoring_notes: ["AUTHOR: searches events related to the FIRST registration named in t1's
        answer (reference resolution); verify a plausible result set once the test account is seeded."]

- thread_id: mt-switch-01
  description: Software -> allocations pivot -> return to software; context must not bleed.
  scenario: topic_switch
  questions:
  - turn_id: t1
    question: What versions of PyTorch are available on Delta?
    required_facts:
    - fact_id: mt-switch-01-t1-pytorch-versions
      fact_text: Answer names the PyTorch module version(s) the software index lists for Delta this
        turn (pytorch-conda 2.8 as of 2026-08-12; the older Anaconda-based modules were removed in
        the RH9 transition) and invents no versions absent from the index.
    ground_truth_stability: time_bound
    authoring_notes: ["Verified 2026-08-12 via get_software_details(pytorch, resource=delta) ->
        pytorch-conda [2.8]; Delta docs confirm pytorch-conda/2.8 post-RH9. STUDENT-CHECK;
        re-verify version at eval time."]
  - turn_id: t2
    question: Separate question — how do ACCESS credits convert to GPU hours on Delta?
    required_facts:
    - fact_id: mt-switch-01-t2-credit-conversion
      fact_text: "Answer explains that each resource has a fixed exchange rate and points to the
        ACCESS Exchange Calculator (allocations.access-ci.org/exchange_calculator); directionally,
        Delta GPU costs far more Credits per unit than Delta CPU (illustrative sample as of
        2026-08-12: 1,000 Credits ≈ 15 Delta GPU units vs 1,000 Delta CPU units — the calculator
        is authoritative, not these numbers)."
    - fact_id: mt-switch-01-t2-no-topic-bleed
      fact_text: Answer does not drag PyTorch/software content into this unrelated allocations answer.
    ground_truth_stability: stable
    authoring_notes: ["Verified 2026-08-12 via access-ci.org/exchange-calculator docs page (sample
        rates table). Rates can change; the calculator is authoritative. STUDENT-CHECK."]
  - turn_id: t3
    question: Back to the software question — which of those PyTorch versions did you say was newest?
    required_facts:
    - fact_id: mt-switch-01-t3-topic-recovery
      fact_text: Answer recovers the t1 topic and names, as newest, a version it actually stated in
        its own t1 answer (as of 2026-08-12 the index listed only 2.8, so 2.8 was the expected value;
        consistency with the agent's own t1 answer is the test, not the specific number).
    ground_truth_stability: time_bound

- thread_id: mt-switch-02
  description: Events -> system status pivot -> return to events.
  scenario: topic_switch
  questions:
  - turn_id: t1
    question: Are there any upcoming ACCESS office hours sessions?
    required_facts:
    - fact_id: mt-switch-02-t1-office-hours
      fact_text: 'Answer lists real recurring ACCESS office-hours sessions, each supported by this
        turn''s tool results, and fabricates none. Anchors as of 2026-08-12 (sufficient but not
        necessary — an answer naming different real sessions from the tool results is equally
        correct): Jetstream2 Office Hours (Tuesdays), Open OnDemand Office Hours, ACCESS and NAIRR
        Pilot Office Hours, CloudBank Office Hours.'
    ground_truth_stability: time_bound
    authoring_notes: ["Verified 2026-08-12 via search_events(type='Office Hours'): Jetstream2 Office
        Hours Tuesdays on Zoom e.g. Aug 11 and Aug 18, Open OnDemand Office Hours Aug 11, ACCESS and
        NAIRR Pilot Office Hours Aug 11, CloudBank Office Hours Aug 19 — these specific dates will be
        past at eval time; the series names are the durable anchor. Recurring series — re-verify
        instances at eval time. STUDENT-CHECK."]
  - turn_id: t2
    question: Different topic — is Bridges-2 currently operational?
    required_facts:
    - fact_id: mt-switch-02-t2-bridges2-status
      fact_text: Answer reflects the live get_infrastructure_news status for Bridges-2 at answer
        time and does not invent outages absent from the feed (at authoring time 2026-08-12 the
        feed showed operational with zero active outages; the turn's own tool results are
        authoritative, not this note).
    ground_truth_stability: time_bound
    authoring_notes: ["Self-refreshing; the judge checks the answer against the turn's own tool
        results. Re-verify at eval time. STUDENT-CHECK."]
  - turn_id: t3
    question: On the office hours from before — when is the next one?
    required_facts:
    - fact_id: mt-switch-02-t3-topic-recovery
      fact_text: "Answer returns to the t1 events and names the soonest one consistently with its own
        t1 answer (recovery after switch)."
    ground_truth_stability: time_bound

- thread_id: mt-mixed-01
  description: Realistic meandering support session chaining lookup, follow-up, status, events, and an authenticated read.
  scenario: mixed
  acting_user_required: true
  questions:
  - turn_id: t1
    question: I'm starting a machine learning project — which ACCESS resources would suit it?
    required_facts:
    - fact_id: mt-mixed-01-t1-ml-resources
      fact_text: Answer recommends real GPU/ML-suitable ACCESS resources (as of 2026-08-12 strong
        candidates include Delta, DeltaAI, Anvil (incl. Anvil AI), Bridges-2, Expanse; naming other
        real GPU resources is also acceptable). Answer does not recommend non-existent resources.
    ground_truth_stability: time_bound
  - turn_id: t2
    question: Which of those have A100 or newer GPUs?
    required_facts:
    - fact_id: mt-mixed-01-t2-gpu-generation-subset
      fact_text: "Answer filters t1's recommendations by GPU generation, resolving 'those' to its own
        t1 list. Per get_resource_hardware as of 2026-08-12: Delta has A100s and H200s, DeltaAI has
        GH200s, Anvil has A100s (Anvil GPU) and H100s (Anvil AI) - any of these named in t1 belong
        in the subset; V100-only resources do not."
    ground_truth_stability: time_bound
  - turn_id: t3
    question: Is that first one up right now, or in maintenance?
    required_facts:
    - fact_id: mt-mixed-01-t3-live-status
      fact_text: Answer checks live infrastructure status for the FIRST resource of t2's answer and
        reports what this turn's infrastructure-status tool results say. If no status tool was
        called this turn, an answer asserting a definite operational status fails this fact.
    ground_truth_stability: time_bound
    authoring_notes: ["Self-refreshing; judged against the turn's own tool results. STUDENT-CHECK."]
  - turn_id: t4
    question: Any upcoming training to help me get started on it?
    required_facts:
    - fact_id: mt-mixed-01-t4-relevant-training
      fact_text: 'Answer names real upcoming training relevant to the referenced resource or to
        new-user onboarding. Anchors as of 2026-08-12: COMPLECS "Getting Started with Batch Job
        Scheduling" (Aug 20) and "Linux tools for text processing" (Sep 3) are real onboarding-
        relevant sessions. Answer does not fabricate events; naming other real onboarding-relevant
        sessions from the tool results is equally correct.'
    ground_truth_stability: time_bound
    authoring_notes: ["Verified 2026-08-12 via search_events. Re-verify at eval time. STUDENT-CHECK."]
  - turn_id: t5
    question: Have I already registered for anything like that?
    required_facts:
    - fact_id: mt-mixed-01-t5-registration-overlap
      fact_text: "Answer checks get_my_registrations for the acting user and answers about overlap
        with t4's events. (AUTHOR: pending test-account seeding)"
    ground_truth_stability: time_bound
    authoring_notes: ["AUTHOR: expected overlap state for the test account against t4's events —
        fill in once the test account is seeded."]
