- id: mcp-cov-013
  question: What XDMoD metrics are available for Delta?
  capability_area: xdmod_tools
  battery: capability_review
  expected_tool: describe_realms
  ground_truth_stability: semi_stable
  required_facts:
  - >-
    Answer describes the XDMoD data realms available (per describe_realms on the charts xdmod server, which
    works without auth): Accounts, Allocations, Cloud, CloudBankFunds, CloudBankSpend, Gateways, Jobs,
    OnDemand, Requests, ResourceSpecifications, SUPREMM (no "Storage" realm in ACCESS XDMoD). Job
    accounting + performance (Jobs/SUPREMM) are the core, including CPU/GPU/memory metrics (SUPREMM).
  - >-
    Answer points to the ACCESS XDMoD portal (xdmod.access-ci.org). Does not claim per-Delta metric values
    it cannot retrieve — describes what CATEGORIES are explorable, not fabricated numbers.
  sources:
  - 'tool: describe_realms (charts xdmod server, no auth) (verified 2026-07-06)'
  authoring_notes:
  - Uses the WORKING charts xdmod server, NOT token-gated xdmod-data. STUDENT-CHECK realm list.

