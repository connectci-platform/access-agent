- id: tc-status-01
  question: Are any ACCESS resources currently down or in maintenance?
  capability_area: system_status
  battery: capability_review
  expected_tool: get_infrastructure_news
  ground_truth_stability: time_bound
  required_facts:
  - Answer reflects the live status feed, naming the resources the feed currently reports as down or in
    maintenance, or stating none are if the feed is clear.
  - Answer adds no outages or maintenance windows beyond what the tool returns.
  - Answer links to a live status page (support.access-ci.org/outages or operations.access-ci.org), not a
    generic docs page.
  sources:
  - 'tool: get_infrastructure_news(time=''current'')'
  authoring_notes:
  - 'Invariant rewrite (2026-08-12): tests live-feed grounding + status-page link, not a frozen snapshot. Prior version named the July 18-21 Anvil window (expired). Grounded at eval time.'

- id: tc-software-01
  question: Which ACCESS resources have PyTorch available?
  capability_area: software_discovery
  battery: capability_review
  expected_tool: search_software
  ground_truth_stability: time_bound
  required_facts:
  - Per search_software(query='pytorch') READING FULL OUTPUT, PyTorch is available on Anvil, Delta,
    DeltaAI (and Bridges-2) — under multiple package names ('pytorch' on Bridges-2/Anvil, 'pytorch-conda'
    on Delta, 'miniforge3_pytorch' on DeltaAI). A shallow reader seeing only 'pytorch' misses Delta/DeltaAI.
  - Answer does not falsely claim PyTorch on resources the tool did not return; correct qualifiers about
    conda/container installability are fine.
  sources:
  - 'tool: search_software(query=''pytorch'') -> available_on_resources across 3 packages (verified 2026-07-06)'
  authoring_notes:
  - Verified 2026-07-06 (April fact confirmed correct; my initial truncated read was wrong). STUDENT-CHECK
    the multi-package mapping stays complete.

