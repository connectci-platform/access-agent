- id: tc-allocations-01
  question: What are the most common allocation types and fields of science in current ACCESS projects?
  capability_area: allocations
  battery: capability_review
  expected_tool: get_allocation_statistics
  ground_truth_stability: time_bound
  required_facts:
  - >-
    Allocation types (per get_allocation_statistics sample, verified 2026-07-06): Explore is most common
    (49), Discover close behind (41), Accelerate smaller (10). Explore and Discover dominate.
  - >-
    Top fields of science: Computer Science, Artificial Intelligence, and Mechanical Engineering are
    consistently among the top fields (exact ordering varies by sample; do NOT assert a single number-one
    — the 2026-07-06 sample had Mechanical Eng 13, AI 12, CS 12, a 1-project spread = noise). Naming 3+
    top fields from the tool output is required.
  - Answer acknowledges it is a ~100-project sample, not a universe count.
  - Answer does not invent counts not in the tool output.
  - >-
    Answer points to a specific see-more URL (allocations.access-ci.org/current-projects or an XDMoD chart
    URL), not a vague "see ACCESS-CI".
  sources:
  - 'tool: get_allocation_statistics(pages_to_analyze=5) (verified 2026-07-06: Explore 49 > Discover 41 > Accelerate 10)'
  authoring_notes:
  - CORRECTED 2026-07-06 - softened "CS is largest field" to a top-cluster claim (sample noise; the fact''s
    own "acknowledge sample" guard governs). Rank order stable; exact counts drift. STUDENT-CHECK.

