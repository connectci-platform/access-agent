# tc-rag CONTROL questions (docs-based, durable — RAG and agent both should succeed)

- id: tc-rag-01
  question: How do I set up SSH keys to log into Expanse?
  capability_area: documentation
  battery: capability_review
  expected_tool: none
  ground_truth_stability: stable
  required_facts:
  - Generate an SSH key pair with ssh-keygen (RSA/ECDSA/ed25519), protect the private key with a passphrase.
  - Describes installing the public key on Expanse (append to ~/.ssh/authorized_keys, or via the ACCESS
    registry at registry.access-ci.org) — at least one path present.
  - Mentions Expanse's login host (login.expanse.sdsc.edu).
  - Mentions Expanse's TOTP/authenticator-based 2FA (Google Authenticator, Duo, etc.) or links the
    enrollment portal.
  sources:
  - 'doc: https://www.sdsc.edu/systems/expanse/user_guide.html'
  - 'doc: https://operations.access-ci.org/identity/ssh-pubkey'
  authoring_notes:
  - Durable docs question (control). STUDENT-CHECK.

- id: tc-rag-02
  question: What's the difference between an Explore allocation and an Accelerate allocation?
  capability_area: documentation
  battery: capability_review
  expected_tool: none
  ground_truth_stability: stable
  required_facts:
  - Explore provides up to 400,000 ACCESS Credits; intended for entry-level/small-scale use; lightweight
    review.
  - Accelerate provides up to 3,000,000 ACCESS Credits; for mid-scale needs; panel merit review (longer
    proposal).
  - Both accept requests anytime.
  sources:
  - 'doc: https://allocations.access-ci.org/project-types'
  - 'doc: https://allocations.access-ci.org/allocations-policy'
  authoring_notes:
  - Durable docs question (control). STUDENT-CHECK credit figures against current policy.

- id: tc-rag-03
  question: How do I use Globus to transfer files between ACCESS resources?
  capability_area: documentation
  battery: capability_review
  expected_tool: none
  ground_truth_stability: stable
  required_facts:
  - User logs in to Globus before transferring (canonical IdP option 'ACCESS-CI (formerly XSEDE)').
  - Each ACCESS resource exposes its own Globus collection/endpoint; users find them via Collection Search.
  - Points at the Globus File Manager (app.globus.org) for the transfer.
  - For laptops/non-endpoint machines, install Globus Connect Personal.
  sources:
  - 'doc: https://docs.globus.org/guides/tutorials/manage-files/transfer-files/'
  authoring_notes:
  - Durable docs question (control). STUDENT-CHECK.

- id: tc-rag-04
  question: Who is eligible to apply for an ACCESS allocation?
  capability_area: documentation
  battery: capability_review
  expected_tool: none
  ground_truth_stability: stable
  required_facts:
  - Names U.S.-based faculty/researchers/postdocs at academic institutions as eligible PIs.
  - Notes graduate students may lead allocations (typically Explore/Discover, with advisor involvement).
  - Mentions eligibility extends beyond academia (nonprofits, FFRDCs, U.S. commercial, etc. — any one).
  - Identifies at least one ineligible group (undergraduates, K-12, unaffiliated individuals, international
    without a U.S. PI).
  - Mentions the institutional-email requirement (NSF Notice 149) — generic gmail/yahoo prohibited.
  sources:
  - 'doc: https://allocations.access-ci.org/allocations-policy'
  authoring_notes:
  - Durable docs question (control). STUDENT-CHECK the NSF-149 email rule currency.

