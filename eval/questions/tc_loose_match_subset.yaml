# Subset of tool_coverage_battery.yaml — used for fast iteration on the
# query_relevance / pagination prompt strengthening (2026-04-29 evening).
#
# Two **targets** (questions where the post-fix loop showed the metadata
# wasn't enough — the agent saw the new fields and ignored or under-used
# them):
#   - tc-allocations-02: loop produced "20 projects… related to climate
#     modeling **or similar topics**" with non-matching items listed
#     (only partial fix from the first prompt iteration).
#   - tc-affinity-01: loop opened "Here are some notable examples:" and
#     never used `pagination.matched` to cite a count.
#
# Two **regression controls** (questions where the post-fix loop did
# well — make sure the strengthened prompt doesn't regress them):
#   - tc-software-02: loop correctly cited Delta CUDA versions (12.8 + 11.8).
#   - tc-status-01: simple confirm/deny, both runs scored well.
#
# Entries are copied verbatim from tool_coverage_battery.yaml so the
# rubrics + authoring notes stay aligned. Re-sync if the parent file
# is updated.

- id: tc-status-01
  question: Are any ACCESS resources currently down or in maintenance?
  capability_area: system_status
  battery: tool_coverage
  expected_tool: get_infrastructure_news
  ground_truth_stability: time_bound
  required_facts:
  - No ACCESS resources are down or in maintenance per the live status feed.
  - Answer adds no outages, resources, or maintenance windows beyond the live status feed.
  - Answer links to a live ACCESS outages/status page (e.g. support.access-ci.org/outages or operations.access-ci.org), not a generic docs/how-to page.
  sources:
  - 'tool: get_infrastructure_news(time=''current'') at localhost:3003'
  - 'doc: https://operations.access-ci.org/'
  authoring_notes:
  - F1 is regenerated from get_infrastructure_news(time='current') before each eval run.
  - 'F1 text varies with state: zero outages → "No ACCESS resources are currently down…"; outages present → "Currently affected: <list from tool>".'
  - 'Snapshot at 2026-04-29: total_outages=0, empty affected_resources, no severity-tier outages. Verified via local MCP get_infrastructure_news(time=''current'') and operations.access-ci.org/infrastructure_news_view.'

- id: tc-software-02
  question: What version of CUDA is available on Delta?
  capability_area: software_discovery
  battery: tool_coverage
  expected_tool: get_software_details
  ground_truth_stability: time_bound
  required_facts:
  - Answer states the current CUDA versions on Delta per get_software_details (12.8 and 11.8 at last refresh).
  - Answer does not conflate Delta with DeltaAI — if any CUDA versions are listed, they are Delta's (12.8, 11.8) and do not include DeltaAI-only versions (13.1.1, 12.9) without identifying them as DeltaAI's.
  sources:
  - 'tool: get_software_details(software_name=''cuda'', resource=''delta'') at localhost:3004'
  - 'doc: https://docs.ncsa.illinois.edu/systems/delta/en/latest/user_guide/software.html'
  - 'doc: https://docs.ncsa.illinois.edu/systems/delta/en/latest/user_guide/prog_env.html'
  authoring_notes:
  - F1's version list is regenerated from get_software_details before each eval run.
  - 'Snapshot at 2026-04-29: get_software_details(software_name=''cuda'', resource=''delta'') returns versions_by_resource={delta: [12.8, 11.8], deltaai: [13.1.1, 12.9, 11.8]}. Earlier 2026-04-27 snapshot conflated these via the top-level versions union — corrected.'
  - Tool's correct argument is `software_name` (not `name` — that returns HTTP 500).
  - On Delta, NCSA exposes CUDA primarily as the `cudatoolkit` module (e.g. `cudatoolkit/25.3_12.8`), not `cuda` — relevant if a future fact tests load syntax.
  - WebFetch on docs.ncsa.illinois.edu/systems/delta/... returned blank during 2026-04-29 ground-truthing (JS-rendered page); WebSearch retrieved the cached content. For Delta-specific ground-truth, prefer WebSearch + MCP over WebFetch.
  - 'Earlier rubric had a third fact requiring loading-hint guidance (''module load cudatoolkit/<version>'' etc). Dropped 2026-04-29 because the question literally asks "what version" — F3 was systematically punishing the loop''s concise style on a dimension unrelated to the asked question. F1 + F2 cover the substantive ground.'

- id: tc-allocations-02
  question: Search for ACCESS projects on Delta related to climate modeling.
  capability_area: allocations
  battery: tool_coverage
  expected_tool: search_projects
  ground_truth_stability: time_bound
  required_facts:
  - No current ACCESS projects on Delta are about climate modeling per search_projects.
  - Answer does not present loose-match results as actual climate-modeling Delta projects.
  sources:
  - 'tool: search_projects(query=''climate modeling'', resource_name=''Delta'') at localhost:3006'
  - 'doc: https://allocations.access-ci.org/current-projects'
  authoring_notes:
  - |-
    F1 is regenerated by running search_projects(query='climate modeling', resource_name='Delta') and search_projects(query='climate', resource_name='Delta') before each eval run.
  - F1 reads 'no projects' if neither query returns a true Delta-family climate-modeling match.
  - The tool uses loose matching — resource_name biases ranking but does not strictly filter.
  - |-
    Snapshot at 2026-04-29: query='climate modeling', resource_name='Delta' returned 20 items; 6 of them have Delta-family allocations (Delta GPU, DeltaAI), but NONE are about climate modeling — fields are Geology (multiphase flow), CS (video generation, regression methods), ME (LPBF additive manufacturing), AI (PyHealth). Loose-match returned the items because of resource_name ranking bias, not topic. Strict query='climate', resource_name='Delta' returned 5 projects, zero on Delta-family. (Earlier 2026-04-27 snapshot incorrectly said "zero of them are actually allocated on a Delta-family resource" — the conflation was: 0 Delta-allocated AND about climate, but ~6 are Delta-allocated and not about climate. Corrected.)
  - MCP response now includes docs.see_all_url=https://allocations.access-ci.org/current-projects.

- id: tc-affinity-01
  question: Are there ACCESS affinity groups for researchers using GPUs?
  capability_area: affinity_groups
  battery: tool_coverage
  expected_tool: search_affinity_groups
  ground_truth_stability: time_bound
  required_facts:
  - 'Answer names at least 3 GPU-equipped ACCESS affinity groups from the public affinity-groups list. The full set as of the snapshot below is ACES, AI Institutes Cyberinfrastructure, Anvil, DELTA, DeltaAI, Expanse, FABRIC Testbed, FASTER, High Performance Visualization, Jetstream-2, Neocortex, and Voyager. Bridges-2 is also acceptable.'
  - Answer reports a count of GPU-equipped affinity groups (e.g., "there are about a dozen", "12 of the affinity groups offer GPU resources", or similar phrasing that gives the user the order of magnitude rather than implying the named examples are the full set).
  - 'Answer treats "affinity group" as the entity being asked about. Named items should be entries on https://support.access-ci.org/affinity-groups, not other ACCESS resources presented as if they were affinity groups. Derecho is a real ACCESS resource (NCAR) but is not on the affinity-groups list, so naming it as a GPU affinity group is a category error.'
  - Answer does not substitute generic category labels (e.g., "machine-learning", "ai", "deep-learning", "GPU computing group") for real affinity group names. Real groups have IDs from the affinity-groups page.
  - Answer points to https://support.access-ci.org/affinity-groups or a specific group URL under that domain.
  sources:
  - 'tool: search_affinity_groups(query=''GPU'', limit=20) at localhost:3011'
  - 'doc: https://support.access-ci.org/affinity-groups (verified live 2026-04-28 via web)'
  authoring_notes:
  - Slow drift — re-verify F1's full list against https://support.access-ci.org/affinity-groups periodically.
  - 'Snapshot at 2026-04-28: full set of GPU-equipped affinity groups on the public page is ACES, AI Institutes Cyberinfrastructure, Anvil, DELTA, DeltaAI, Expanse, FABRIC Testbed, FASTER, High Performance Visualization, Jetstream-2, Neocortex, Voyager.'
  - |-
    Note about Derecho: prior parity testing flagged both agents naming Derecho as a GPU affinity group. Derecho IS a real ACCESS-allocated NCAR resource with GPUs (Derecho-GPU), but it is NOT an entry on the affinity-groups page. The mistake is a resource-vs-group conflation, not a fabrication. F2 catches this. The UKY RAG corpus appears to have an entry that conflates these — a corpus issue worth tracking separately.
