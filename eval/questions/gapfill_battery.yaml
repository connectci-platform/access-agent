- id: gf-events-01
  question: What ACCESS training or office hours are coming up this week?
  capability_area: events
  battery: gapfill
  expected_tool: search_events
  ground_truth_stability: time_bound
  purpose: discrimination
  required_facts:
  - Answer lists real upcoming training/office-hours events from search_events(date='upcoming'),
    each with the date and support.access-ci.org/events/<id> URL the tool returns.
  - Every named event traces to a tool result; the answer fabricates no events, dates, or URLs.
  sources:
  - 'tool: search_events(date=''upcoming'') (query_relevance: exact)'
  authoring_notes:
  - 'Invariant rewrite (2026-08-12): tests that upcoming events are grounded in the live feed with real URLs, not a frozen July event list (those events have passed). Grounded at eval time.'

- id: gf-events-02
  question: Are there any GPU or ML training events coming up?
  capability_area: events
  battery: gapfill
  expected_tool: search_events
  ground_truth_stability: time_bound
  purpose: discrimination
  required_facts:
  - Answer presents only the genuinely gpu/ml-tagged upcoming events from search_events(date='upcoming',
    tags='gpu') — those whose returned tags actually include gpu, ai, or machine-learning — with their
    dates and support.access-ci.org/events/<id> URLs.
  - CAUTION - the tags filter is LOOSE - it returns the full upcoming set including events WITHOUT a
    gpu/ml tag. A correct answer must NOT present those untagged events as gpu/ml events; it filters to
    events actually carrying the tags.
  - Does not fabricate events or dates.
  sources:
  - 'tool: search_events(date=''upcoming'', tags=''gpu'') -> loose filter; select genuinely-tagged events'
  authoring_notes:
  - 'Invariant rewrite (2026-08-12): the discrimination point (loose tag filter -> must not present untagged events as gpu/ml) is stable and dateless. Prior version named the July Sage Office Hours sessions, which have passed. Grounded at eval time by inspecting returned tags.'

