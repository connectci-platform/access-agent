- id: gf-hw-01
  question: What are the hardware specifications of Anvil?
  capability_area: compute_resources
  battery: gapfill
  expected_tool: get_resource_hardware
  ground_truth_stability: stable
  purpose: regression
  required_facts:
  - Per get_resource_hardware(id='Anvil') (verified 2026-07-01) Anvil CPU = 1,000 nodes, 2x 64-core AMD
    EPYC "Milan", 256GB DDR4 (32 large-mem nodes at 1TB), 5.3 PF peak, 100Gbps HDR100 IB.
  - Anvil GPU = 16 nodes x 4 NVIDIA A100. Anvil AI = 21 nodes x 4 NVIDIA H100 80GB SXM.
  - Answer keeps the three sub-systems (CPU/GPU/AI) distinct; does not merge them; does not invent counts.
  sources:
  - 'tool: get_resource_hardware(id=''Anvil'')'
  authoring_notes:
  - Operations/CiDeR data is known to LAG reality — STUDENT-CHECK specs against the RP''s own docs, not
    just the tool. Marked regression (not discrimination) — specs likely also in RAG.

- id: gf-hw-02
  question: Which ACCESS resources have GPUs?
  capability_area: compute_resources
  battery: gapfill
  expected_tool: search_resources
  ground_truth_stability: semi_stable
  purpose: regression
  required_facts:
  - Per search_resources(has_gpu=true) (STRUCTURED boolean filter, verified 2026-07-06) 14 GPU resources
    are returned - ACES, PNRP, Bridges-2, Stampede3, REPACSS, Anvil, Jetstream2, Expanse, Launch, Nexus,
    Derecho, Delta, DeltaAI, OSG. A good answer names a representative set and/or the count.
  - Answer uses the has_gpu filter, not description keyword-matching. NOTE this tool correctly includes
    DeltaAI and Derecho (which the affinity keyword-search missed) - both are GPU resources.
  - May note availability flags the tool/allocations pages carry, e.g. "PNRP / Nexus - COMING SOON".
    (Do NOT claim Derecho is closed to new allocations — Derecho accepts Explore/Discover ACCESS requests.)
  sources:
  - 'tool: search_resources(has_gpu=true) -> 14 items (verified 2026-07-06)'
  authoring_notes:
  - Verified 2026-07-06. This is the RIGHT tool for "which resources have GPUs" - the affinity tool did
    this badly (missed DeltaAI/Derecho due to thin descriptions). STUDENT-CHECK the list stays current.

- id: gf-alloc-01
  question: What are the most common allocation types in current ACCESS projects?
  capability_area: allocations
  battery: gapfill
  expected_tool: get_allocation_statistics
  ground_truth_stability: semi_stable
  purpose: discrimination
  required_facts:
  - Per get_allocation_statistics (100-project sample, verified 2026-07-06) Explore (49) > Discover (41)
    > Accelerate (10). Answer conveys Explore is most common, Discover close behind.
  - Answer acknowledges it is a sample; does not invent precise universe counts.
  sources:
