  authoring_notes:
  - Sample is noisy; treat ordering as approximate. STUDENT-CHECK.

- id: gf-docs-01
  question: How do I set up multi-factor authentication for my ACCESS account?
  capability_area: account_management
  battery: gapfill
  expected_tool: search_docs
  ground_truth_stability: stable
  purpose: regression
  required_facts:
  - Per search_docs (verified 2026-07-06) answer synthesizes MFA enrollment steps from the returned
    excerpts and cites the canonical source URL https://operations.access-ci.org/identity/manage-mfa
    (the identity FAQ https://operations.access-ci.org/identity/faq is also acceptable).
  - Answer cites real URLs from the tool's excerpts; does not fabricate steps or links.
  sources:
  - 'tool: search_docs(query=''...multi-factor authentication...'') -> operations.access-ci.org/identity/manage-mfa, /identity/faq'
  authoring_notes:
  - Verified 2026-07-06. search_docs is retrieval-only (agent synthesizes); NOT the old RAG endpoint
    (which did its own inferencing) - do not conflate. STUDENT-CHECK URLs are the right canonical ones.
