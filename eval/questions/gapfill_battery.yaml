# WHERE FACTS LIVE: once a question's facts are loaded into
# reporting.question_facts, the DB copy is what scoring uses and the
# required_facts below are inert. Editing them here does NOT change any score.
# Correct facts in the reporting dashboard, where they are versioned and
# attributed. This file's job is to say which questions make up the battery.
#
# Gap-fill capability battery — brings the capability set into the 30-40 range.
# First-pass required_facts authored from VERIFIED current hosted-tool output (2026-07-06), tc-* template.
# Every fact is a STUDENT-CHECK first pass, NOT final ground truth. Some facts need exact values filled
# (see authoring_notes "AUTHOR:"). purpose tag: discrimination = live data RAG can't have;
# regression = stable, fact-groundable, catches version drift.

- id: gf-status-01
  question: Is Anvil available right now, or is there maintenance?
  capability_area: system_status
  battery: gapfill
  expected_tool: get_infrastructure_news
  ground_truth_stability: time_bound
  purpose: discrimination
  required_facts:
  - Answer reports Anvil's current availability from get_infrastructure_news, reflecting whatever
    the live feed says at eval time (operational, or an active/scheduled maintenance window if one is posted).
  - If the feed posts a maintenance window, the answer conveys its actual status (e.g. scheduled, postponed,
    in progress) rather than flatly asserting Anvil is down; if the feed shows none, the answer says Anvil is available.
  - Answer does not invent a maintenance window, firm date, or outage that is not in the feed.
  sources:
  - 'tool: get_infrastructure_news(ids=[''Anvil'']) -> current status'
  authoring_notes:
  - 'Invariant rewrite (2026-08-12): tests live-feed grounding for Anvil status, not a frozen window.
    Prior version hardcoded the July 18-21 postponed outage, which expired. Grounded at eval time.'

- id: gf-status-02
  question: Any planned maintenance on Bridges-2 this week?
  capability_area: system_status
  battery: gapfill
  expected_tool: get_infrastructure_news
  ground_truth_stability: time_bound
  purpose: discrimination
  required_facts:
  - Answer reports Bridges-2 scheduled maintenance from get_infrastructure_news, naming the actual
    upcoming window(s) the feed returns at eval time, or stating none are scheduled if the feed shows none.
  - Answer does not fabricate a maintenance window that is not in the feed.
  sources:
  - 'tool: get_infrastructure_news(resource=''bridges2'', time=''scheduled'') -> scheduled windows'
  authoring_notes:
  - 'Invariant rewrite (2026-08-12): tests live scheduled-maintenance grounding for Bridges-2, not a frozen July 7 window (expired). Grounded at eval time.'

